<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool 2 — one model, stacked historical runs (real data)</title>
<style>
  /* Tool ribbon - the three tools are one product and were reachable only by
     knowing each other's URL. Sits above everything, styled as navigation
     rather than as another control so it does not compete with the row of
     actual controls below it. */
  .toolbar { display:flex; gap:0; align-items:stretch; margin: 0 0 6px;
             border-bottom:1px solid #d8d4c8; }
  .toolbar a { font: 11px/1 ui-monospace, "SF Mono", Consolas, monospace;
               text-decoration:none; color:#7a776c; padding:7px 13px;
               border:1px solid transparent; border-bottom:none;
               letter-spacing:.03em; }
  .toolbar a:hover { color:#232320; background:#efece3; }
  .toolbar a.here { color:#232320; font-weight:700; background:#fffdf8;
                    border-color:#d8d4c8; border-bottom:1px solid #fffdf8;
                    margin-bottom:-1px; }
  html, body { height: 100%; }
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    background: #f6f4ef;
    color: #232320;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* #mapArea below is the one flexible element that
      absorbs whatever room is left after controls+slider+legend - see its
      own comment. Same layout approach as newest_runs.html. */
  }
  .controls {
    display: flex;
    align-items: center;
    /* The quantity radios are wider than the select they replaced, so on a
       narrow viewport this row can no longer fit on one line - wrap instead
       of letting body's overflow:hidden clip #cursorReadout off the right
       edge. A wrapped second line just makes this fixed-height block taller;
       #mapArea absorbs the difference. */
    flex-wrap: wrap;
    gap: 18px;
    row-gap: 4px; /* after the `gap` shorthand, which would otherwise reset it */
    margin-bottom: 4px;
    font-size: 11.5px;
    border-bottom: 1px solid #d8d4c8;
    padding: 4px 6px;
    flex: none;
  }
  .controls label {
    color: #7a776c;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 9.5px;
  }
  /* Quantity control - byte-for-byte the same look as newest_runs.html's, so
     the three tools read as one product. Three mutually-exclusive radios plus
     an INDEPENDENT rain checkbox (rain is an overlay, not a quantity). */
  .quantityGroup {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .quantityGroup .opt {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #232320;
    cursor: pointer;
  }
  .quantityGroup input[type=radio] { accent-color: #8b3a2f; }
  .rainOpt {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #232320;
    cursor: pointer;
    padding-left: 8px;
    border-left: 1px solid #d8d4c8;
  }
  .rainOpt input[type=checkbox] { accent-color: #2f5f8b; }
  .placeholderNote {
    font-size: 9.5px;
    color: #a8a498;
    font-style: italic;
  }
  /* Cloud-prob mode locks the model picker to the only prob-capable model by
     disabling every other <option>. Chrome greys disabled options on its own,
     Firefox barely does - so say it explicitly. (Tool 1 greys ROWS instead,
     via .row.disabled; here the rows are runs of one model, and every run of
     the prob-capable model has prob frames, so there is nothing to grey.) */
  select option:disabled { color: #a8a498; }
  select {
    background: #fff;
    color: #232320;
    border: 1px solid #232320;
    border-radius: 0;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 11.5px;
  }
  #extentInput {
    width: 160px;
    accent-color: #8b3a2f;
    vertical-align: middle;
  }
  #extentReadout {
    font-variant-numeric: tabular-nums;
    color: #55534c;
    margin-left: 4px;
    white-space: nowrap;
  }
  #cursorReadout {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    color: #8b3a2f;
    font-weight: 600;
    white-space: nowrap;
  }
  #stackWrap {
    position: relative;
    border: 1px solid #232320;
    background: #fff;
    padding: 3px 14px 3px 0;
    user-select: none;
    flex: none; /* fixed content height - #mapArea is the one flexible element */
    cursor: default;
    touch-action: none;
  }
  #stackWrap.hint-time { cursor: ew-resize; }
  #stackWrap.hint-row { cursor: ns-resize; }
  .row {
    display: flex;
    align-items: center;
    height: 13px;
  }
  .row:hover { background: #f6f4ef; }
  .row.selected { background: #f0e8d2; }
  .rowLabel {
    width: 130px;
    flex: none;
    font-size: 9.5px;
    color: #55534c;
    padding-left: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.selected .rowLabel { color: #232320; font-weight: 700; }
  .rowLabel .age { color: #a8a498; margin-left: 4px; }
  .row.selected .rowLabel .age { color: #8a7a5a; }
  .preloadBtn {
    width: 22px;
    flex: none;
    font-size: 8px;
    text-align: center;
    color: #a8a498;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    position: relative;
  }
  /* Invisible enlarged hit-box for touch - the 13px row height is load-bearing
     elsewhere (tick alignment in layoutTicks), so grow the tap target via an
     absolutely-positioned pseudo-element instead of padding/size on the real
     box; clicks/taps on it bubble to .preloadBtn's own listener as normal. */
  .preloadBtn::before {
    content: "";
    position: absolute;
    top: -6px;
    bottom: -6px;
    left: -4px;
    right: -4px;
  }
  .preloadBtn:hover { color: #232320; }
  .preloadBtn.loading { color: #8b3a2f; }
  .preloadBtn.done { color: #2f6f3f; }
  .rowTrack {
    position: relative;
    flex: 1;
    height: 100%;
  }
  .tick {
    position: absolute;
    top: 3px;
    width: 2px;
    height: 7px;
    background: #a19e92;
  }
  .row.selected .tick { background: #8a5a20; }
  .tick.near {
    width: 3px;
    height: 13px;
    top: 0;
    background: #8b3a2f;
  }
  .tick.isInit {
    background: #55534c;
    width: 2px;
    height: 13px;
    top: 0;
  }
  .row.selected .tick.isInit { background: #232320; }
  #cursorLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #8b3a2f;
    pointer-events: none;
    z-index: 5;
  }
  #cursorHandle {
    position: absolute;
    top: -7px;
    width: 0;
    height: 0;
    margin-left: -5px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 7px solid #8b3a2f;
    cursor: ew-resize;
    z-index: 6;
  }
  #nowLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #2f6f3f;
    pointer-events: none;
    z-index: 4;
    opacity: 0.6;
  }
  /* The eclipse moment itself (manifest.eclipse_t, ultimately the ECLIPSE_T
     env var - never hardcoded here). Violet AND dashed so it can't be
     confused with either the solid red drag-cursor or the solid green now
     line, and pointer-events:none for the same reason #nowLine has it: it
     must never intercept a drag. Starts hidden - it's only shown when T
     actually falls inside the visible window (see layoutTicks), which today
     is rare, since the real eclipse is weeks past every model's horizon.
     Identified by the "eclipse" entry in the .legend block below. */
  #eclipseLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px; /* centre the 2px band on the computed pixel; the
      position math itself is identical to #nowLine's */
    background: repeating-linear-gradient(to bottom, #6a2fa0 0 4px, transparent 4px 8px);
    pointer-events: none;
    z-index: 3;
    display: none;
  }
  #axisRow {
    display: flex;
    align-items: center;
    height: 14px;
    margin-top: 3px;
    border-top: 1px solid #232320;
  }
  #axisRow .rowLabel, #axisRow .preloadBtn { visibility: hidden; }
  .axisTick {
    position: absolute;
    top: 3px;
    font-size: 9px;
    color: #7a776c;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  #mapArea {
    margin-top: 2px;
    border: 1px solid #232320;
    background: #fff;
    flex: 1;    /* absorbs whatever vertical room is left below the
      fixed-size controls/slider/legend above - same layout approach as
      newest_runs.html. */
    min-height: 80px; /* just enough for the placeholder/error text to stay
      legible on a very cramped viewport - not a target size. */
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    color: #7a776c;
    font-size: 12px;
    padding: 6px;
    box-sizing: border-box;
  }
  #mapArea .big { font-size: 14px; color: #232320; font-weight: 700; }
  #mapArea .placeholder-tag {
    font-size: 9.5px;
    color: #a8a498;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  #mapAreaImg {
    max-width: 100%;
    flex: 1 1 0;
    min-height: 0;
    width: auto;
    object-fit: contain;
    display: none;
  }
  .legend {
    font-size: 9.5px;
    color: #7a776c;
    margin-top: 4px;
    flex: none;
  }
  .legend span { margin-right: 16px; }
  .legend .sw { display: inline-block; width: 9px; height: 9px; vertical-align: -1px; margin-right: 3px; }
</style>
</head>
<body>

<div class="toolbar">
  <a href="index.html">Newest runs</a>
  <a href="compare-runs.html" class="here">Compare runs</a>
  <a href="at-eclipse.html">At eclipse</a>
  <a href="pipeline.html">Pipeline</a>
</div>

<div class="controls">
  <div>
    <label for="modelSelect">Model</label>
    <select id="modelSelect"></select>
  </div>
  <div class="quantityGroup" id="quantityGroup">
    <label style="margin-right:0">Quantity</label>
    <label class="opt"><input type="radio" name="quantityMode" value="temp"> Temp</label>
    <label class="opt"><input type="radio" name="quantityMode" value="cloudCover" checked> Cloud cover</label>
    <label class="opt"><input type="radio" name="quantityMode" value="cloudProb"> Cloud prob.</label>
  </div>
  <label class="rainOpt"><input type="checkbox" id="rainCheckbox"> Rain</label>
  <span class="placeholderNote" id="placeholderNote"></span>
  <div>
    <label for="extentInput">Extent</label>
    <input type="range" id="extentInput" min="0" max="100" value="100">
    <span id="extentReadout">—</span>
  </div>
  <div id="cursorReadout">—</div>
</div>

<div id="stackWrap">
  <div id="rows"></div>
  <div id="axisRow"><div class="rowLabel"></div><div class="preloadBtn"></div><div class="rowTrack" id="axisTrack"></div></div>
  <div id="cursorLine"><div id="cursorHandle"></div></div>
  <div id="nowLine"></div>
  <div id="eclipseLine"></div>
</div>

<div class="legend">
  <span><span class="sw" style="background:#55534c"></span>run init</span>
  <span><span class="sw" style="background:#a19e92"></span>archived step</span>
  <span><span class="sw" style="background:#8b3a2f"></span>nearest to cursor</span>
  <span><span class="sw" style="background:#2f6f3f;opacity:.6"></span>now</span>
  <span><span class="sw" style="background:repeating-linear-gradient(to bottom,#6a2fa0 0 3px,transparent 3px 6px)"></span>eclipse</span>
</div>

<div id="mapArea">
  <div class="placeholder-tag" id="mapAreaTag">select a run</div>
  <img id="mapAreaImg" alt="">
  <div class="big" id="mapAreaTitle"></div>
  <div id="mapAreaSub">—</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Real data via tool2_manifest.json (scripts/generate_tool2_manifest.py).
// ---------------------------------------------------------------------------
const NOW = new Date();
let MODELS = {}; // {id: {label, runs: [{runInit, steps: [h,...], imagesByStep, hasDataByStep}]}}
// The eclipse moment, read from the manifest (which gets it from the
// ECLIPSE_T env var via eclipse_t() - CLAUDE.md forbids hardcoding it here).
// null when the manifest predates the eclipse_t field, or carries an
// unparseable value: the marker is then simply never drawn.
let ECLIPSE_TIME = null;

// Hours of axis to keep BEYOND the eclipse, so the marker never sits flush
// against the right edge where it reads as "the axis just ends here".
const ECLIPSE_AXIS_MARGIN_H = 24;

// The axis must reach past the eclipse even when none of THIS model's runs
// forecast anywhere near it - the normal case this far out, and exactly when
// it is most useful: the empty stretch between the furthest run and the
// marker IS the information, showing how far off T still is and visibly
// shrinking as each new run's horizon advances. Sizing the axis to the data
// alone hides that, and makes the marker appear and disappear depending on
// which model happens to be selected (AROME France reaches 51h, GEFS's 00Z
// run 840h). Returns -Infinity (no floor) when the manifest predates
// eclipse_t.
function axisEndFloor() {
  if (!ECLIPSE_TIME) return -Infinity;
  return ECLIPSE_TIME.getTime() + ECLIPSE_AXIS_MARGIN_H * 3600 * 1000;
}

// Known, permanent (not-a-bug) per-model field gaps - same facts already
// documented in newest_runs.html/at_eclipse.html.
// Cloud probability (per-pixel, not the pooled point metric T32 uses for
// site ranking) is a per-grid-cell ensemble spread metric - only meaningful
// for a model with genuine multi-member native low/mid/high data. Right now
// that's aifs_ens only; aifs_single is deterministic (a single run has no
// member spread to compute a P() from), so it's listed as a real gap below,
// not rendered as a degenerate binary map.
//
// This replaces the old per-model/per-field KNOWN_FIELD_GAPS table: with
// `total` no longer a user-selectable quantity (it's the FALLBACK for models
// with no native low/mid/high - see resolveField), the only remaining gap is
// "this model isn't the prob-capable ensemble", which PROB_ONLY_MODEL below
// already states once instead of nine times.
const PROB_HML_GAP = "Needs an ensemble with native low/mid/high cloud - only AIFS ENS currently qualifies";

async function loadManifest() {
  const resp = await fetch("tool2_manifest.json");
  if (!resp.ok) throw new Error("tool2_manifest.json fetch failed: HTTP " + resp.status);
  const manifest = await resp.json();

  // Optional - a manifest generated before generate_tool2_manifest.py started
  // emitting eclipse_t simply has no marker, rather than an error.
  const eclipseRaw = manifest.eclipse_t ? new Date(manifest.eclipse_t) : null;
  ECLIPSE_TIME = eclipseRaw && !isNaN(eclipseRaw.getTime()) ? eclipseRaw : null;

  MODELS = {};
  manifest.models.forEach(m => {
    MODELS[m.id] = {
      label: m.label,
      runs: m.runs.map(r => ({
        runInit: new Date(r.run_init),
        steps: r.steps.map(s => s.h),
        imagesByStep: Object.fromEntries(r.steps.map(s => [s.h, s.images])),
        hasDataByStep: Object.fromEntries(r.steps.map(s => [s.h, s.has_data])),
      })),
    };
  });
}
// ---------------------------------------------------------------------------

let selectedModelId = null;
let selectedRunIdx = null; // index into the currently-built row list
let cursorTime = NOW;      // Date
let AXIS_START = NOW, AXIS_END = NOW; // full span for the current model
let axisRightMs = 0;       // current right edge, narrowed by the extent slider

// Quantity is a 3-way radio (temp/cloudCover/cloudProb) + an independent rain
// overlay checkbox - identical control to newest_runs.html's. NOT a field name:
// which field backs cloudCover differs per model (see resolveField). Temp and
// the rain overlay are both placeholders (no real data path yet).
let quantityMode = "cloudCover";
let rainOn = false;
// Cloud prob only ever has data for aifs_ens (the only ensemble with a native
// low/mid/high split). Tool 1 greys the non-capable ROWS; here the rows are
// the RUNS of one model - every run of aifs_ens has prob frames - so the lock
// belongs on the model picker instead: non-capable <option>s get disabled and
// the selection is forced to aifs_ens. This remembers what was selected
// before, so leaving Cloud prob restores it instead of stranding you on
// aifs_ens (same role as tool1's modelBeforeProbForce).
let modelBeforeProbForce = null;
const PROB_ONLY_MODEL = "aifs_ens";

const modelSelect = document.getElementById("modelSelect");
const quantityRadios = document.querySelectorAll('input[name="quantityMode"]');
const rainCheckbox = document.getElementById("rainCheckbox");
const placeholderNote = document.getElementById("placeholderNote");
const extentInput = document.getElementById("extentInput");
const extentReadout = document.getElementById("extentReadout");
const rowsEl = document.getElementById("rows");
const axisTrack = document.getElementById("axisTrack");
const stackWrap = document.getElementById("stackWrap");
const cursorLine = document.getElementById("cursorLine");
const cursorReadout = document.getElementById("cursorReadout");
const nowLine = document.getElementById("nowLine");
const eclipseLine = document.getElementById("eclipseLine");
const mapAreaTag = document.getElementById("mapAreaTag");
// A real, successfully-rendered frame needs no banner - the image speaks
// for itself. Collapsed via display:none (not just an empty string) so it
// doesn't leave behind an empty line's worth of vertical space/gap.
function setMapTag(text) {
  mapAreaTag.textContent = text;
  mapAreaTag.style.display = text ? "" : "none";
}
const mapAreaImg = document.getElementById("mapAreaImg");
const mapAreaTitle = document.getElementById("mapAreaTitle");
const mapAreaSub = document.getElementById("mapAreaSub");

let builtRows = []; // [{run, track}], newest-on-top order — populated per model load

function fmtTime(d) {
  return d.toISOString().slice(0, 16).replace("T", " ") + "Z";
}
function fmtRunLabel(d) {
  return d.toISOString().slice(5, 16).replace("T", " ") + "Z";
}
function fmtAge(runInit) {
  const h = Math.round((NOW - runInit) / 3600000);
  if (h < 24) return h + "h ago";
  return (h / 24).toFixed(1) + "d ago";
}
function stepValidTime(run, h) {
  return new Date(run.runInit.getTime() + h * 3600 * 1000);
}

// The complete set of fields rendered on disk today (the frame renderer's
// supported_fields()) - what preloadRun() below warms. Only ever 2 of the 3
// are actually displayable for a given model: exactly one cloud-cover field
// exists per model (hml_composite for models with native low/mid/high, total
// for ECMWF HRES/ENS which have neither), plus prob_hml_composite for
// aifs_ens alone.
const IMAGE_FIELDS = ["total", "hml_composite", "prob_hml_composite"];

// Is field f actually displayable for this step? An image URL is always
// written even when the underlying data is missing (a "(no data)" placeholder
// frame), so has_data is what decides - but newer manifests simply omit the
// field instead, and a manifest predating has_data has none at all, hence
// "assume real unless explicitly false".
function fieldHasData(images, hasData, f) {
  if (!images || !images[f]) return false;
  return hasData ? hasData[f] !== false : true;
}

// Which field to actually display for the current quantityMode. `total` is
// NOT a user-selectable quantity - it's the FALLBACK for the models with no
// native low/mid/high to build a composite from (ecmwf_hres/ecmwf_ens). Cloud
// prob has no fallback: prob_total is deliberately never rendered, and only
// aifs_ens has prob data at all (see PROB_ONLY_MODEL/applyQuantityMode).
// Same resolution as newest_runs.html's resolveField().
function resolveField(images, hasData, mode) {
  if (mode === "cloudCover") {
    if (fieldHasData(images, hasData, "hml_composite")) return "hml_composite";
    if (fieldHasData(images, hasData, "total")) return "total";
    return null;
  }
  if (mode === "cloudProb") {
    return fieldHasData(images, hasData, "prob_hml_composite") ? "prob_hml_composite" : null;
  }
  return null; // temp - placeholder, no field to resolve yet
}

// Can this model answer the current quantity AT ALL (regardless of run/step)?
// Cloud cover always can - every model has either a composite or a total.
// Cloud prob needs the one prob-capable ensemble; Temp has no data path for
// any model yet. Normally the model picker is locked to PROB_ONLY_MODEL in
// Cloud prob mode, so a false here only happens against a manifest that has
// no aifs_ens to force-select at all.
function modelSupportsMode(modelId, mode) {
  if (mode === "temp") return false;
  if (mode === "cloudProb") return modelId === PROB_ONLY_MODEL;
  return true;
}

const preloadedRuns = new Set(); // run.runInit.getTime() values already preloaded

function preloadRun(run, btnEl) {
  const key = run.runInit.getTime();
  if (preloadedRuns.has(key)) return;
  if (btnEl.classList.contains("loading")) return; // already in flight - a second
    // click here used to start an overlapping preload pass with its own
    // independent `loaded` counter, racing the first and making the shown
    // percentage jump around between the two.
  const urls = [];
  run.steps.forEach(h => {
    const images = run.imagesByStep[h] || {};
    IMAGE_FIELDS.forEach(f => { if (images[f]) urls.push(images[f]); });
  });
  if (!urls.length) return;

  btnEl.classList.add("loading");
  btnEl.classList.remove("done");
  let loaded = 0;
  btnEl.textContent = "0%";
  urls.forEach(url => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loaded++;
      btnEl.textContent = Math.round((loaded / urls.length) * 100) + "%";
      if (loaded === urls.length) {
        preloadedRuns.add(key);
        btnEl.classList.remove("loading");
        btnEl.classList.add("done");
        btnEl.textContent = "✓";
      }
    };
    img.src = url;
  });
}

function populateModelSelect() {
  modelSelect.innerHTML = "";
  Object.entries(MODELS).forEach(([id, m]) => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = m.label + " (" + m.runs.length + " runs archived)";
    modelSelect.appendChild(opt);
  });
}

function loadModel(modelId) {
  selectedModelId = modelId;
  const model = MODELS[modelId];
  const runsNewestFirst = [...model.runs].reverse();

  AXIS_START = runsNewestFirst[runsNewestFirst.length - 1].runInit;
  const reaches = model.runs.map(r => stepValidTime(r, Math.max(...r.steps)));
  AXIS_END = new Date(Math.max(...reaches.map(d => d.getTime()), axisEndFloor()));

  const fullSpanMs = AXIS_END - AXIS_START;
  extentInput.min = 0;
  extentInput.max = fullSpanMs;
  extentInput.step = 3600 * 1000; // 1h granularity
  extentInput.value = fullSpanMs;
  axisRightMs = fullSpanMs;

  rowsEl.innerHTML = "";
  builtRows = [];
  runsNewestFirst.forEach((run, idx) => {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.idx = idx;

    const label = document.createElement("div");
    label.className = "rowLabel";
    label.innerHTML = fmtRunLabel(run.runInit) + '<span class="age">' + fmtAge(run.runInit) + "</span>";
    row.appendChild(label);

    const preloadBtn = document.createElement("div");
    preloadBtn.className = "preloadBtn";
    preloadBtn.textContent = "⤓";
    preloadBtn.title = "Preload all frames for this run (smoother scrubbing)";
    preloadBtn.addEventListener("click", e => {
      e.stopPropagation();
      preloadRun(run, preloadBtn);
    });
    row.appendChild(preloadBtn);

    const track = document.createElement("div");
    track.className = "rowTrack";
    row.appendChild(track);

    rowsEl.appendChild(row);
    builtRows.push({ run, row, track });
  });

  cursorTime = new Date(Math.min(Math.max(cursorTime.getTime(), AXIS_START.getTime()), AXIS_START.getTime() + axisRightMs));
  layoutTicks();
  selectRun(0); // newest run by default
}

function pickAxisIntervalMs(spanMs) {
  const hourMs = 3600 * 1000;
  const candidatesH = [1, 2, 3, 6, 12, 24, 48, 96, 168, 336];
  for (const c of candidatesH) {
    if (spanMs / (c * hourMs) <= 8) return c * hourMs;
  }
  return candidatesH[candidatesH.length - 1] * hourMs;
}

function timeToPx(t, trackWidthPx) {
  const frac = (t - AXIS_START) / axisRightMs;
  return Math.round(Math.min(1, Math.max(0, frac)) * trackWidthPx);
}

function layoutTicks() {
  const trackWidthPx = axisTrack.getBoundingClientRect().width;
  builtRows.forEach(({ run, track }) => {
    track.innerHTML = "";
    run.steps.forEach(h => {
      const vt = stepValidTime(run, h);
      if (vt - AXIS_START > axisRightMs) return;
      const tick = document.createElement("div");
      tick.className = "tick" + (h === 0 ? " isInit" : "");
      tick.style.left = timeToPx(vt, trackWidthPx) + "px";
      tick.dataset.hour = h;
      tick.dataset.validMs = vt.getTime();
      track.appendChild(tick);
    });
  });

  axisTrack.innerHTML = "";
  const intervalMs = pickAxisIntervalMs(axisRightMs);
  for (let ms = 0; ms <= axisRightMs; ms += intervalMs) {
    const t = new Date(AXIS_START.getTime() + ms);
    const el = document.createElement("div");
    el.className = "axisTick";
    el.style.left = timeToPx(t, trackWidthPx) + "px";
    el.textContent = t.toISOString().slice(5, 16).replace("T", " ");
    axisTrack.appendChild(el);
  }

  const nowPx = timeToPx(NOW, trackWidthPx);
  const trackRect = axisTrack.getBoundingClientRect();
  const wrapRect = stackWrap.getBoundingClientRect();
  const trackOffsetPx = trackRect.left - wrapRect.left;
  if (NOW >= AXIS_START && NOW - AXIS_START <= axisRightMs) {
    nowLine.style.display = "block";
    nowLine.style.left = Math.round(trackOffsetPx + nowPx) + "px";
  } else {
    nowLine.style.display = "none";
  }

  // Same visible-range test and same positioning math as #nowLine above -
  // deliberately not re-derived, so the marker lines up with the ticks
  // exactly the way the now line does. Expected to be hidden most of the
  // time: the eclipse is normally far beyond every model's forecast horizon,
  // so it falls outside [AXIS_START, AXIS_START+axisRightMs].
  if (ECLIPSE_TIME && ECLIPSE_TIME >= AXIS_START && ECLIPSE_TIME - AXIS_START <= axisRightMs) {
    eclipseLine.style.display = "block";
    eclipseLine.style.left = Math.round(trackOffsetPx + timeToPx(ECLIPSE_TIME, trackWidthPx)) + "px";
  } else {
    eclipseLine.style.display = "none";
  }
}

function nearestStep(run, targetTime) {
  // Only consider steps still inside the extent slider's current window -
  // cursorTime itself is always clamped to [AXIS_START, AXIS_START+axisRightMs]
  // (see timeFromClientX), but without this filter the "nearest" step could
  // be one the extent slider has hidden (e.g. a real step just past a cadence
  // gap - 240h/246h for gefs_extended - that's closer in raw distance than
  // the last VISIBLE step). That desyncs the displayed step/valid-time from
  // anything actually drawn on the (narrowed) axis - reads as the cursor not
  // lining up with the model's hours at all.
  const visible = run.steps.filter(h => stepValidTime(run, h) - AXIS_START <= axisRightMs);
  if (!visible.length) return null;
  return visible.reduce((best, h) => {
    const bestDiff = Math.abs(stepValidTime(run, best) - targetTime);
    const diff = Math.abs(stepValidTime(run, h) - targetTime);
    return diff < bestDiff ? h : best;
  });
}

function selectRun(idx) {
  selectedRunIdx = idx;
  document.querySelectorAll(".row").forEach(r => {
    r.classList.toggle("selected", parseInt(r.dataset.idx, 10) === idx);
  });
  updateCursorUI();
}

// Switch the model picker to modelId and rebuild the run stack for it - the
// programmatic equivalent of the user picking it, since setting .value alone
// fires no "change" event.
function switchModel(modelId) {
  modelSelect.value = modelId;
  loadModel(modelId);
}

function applyQuantityMode(mode) {
  const wasForced = quantityMode === "cloudProb";
  quantityMode = mode;

  // Only lock the picker if the prob-capable model is actually in this
  // manifest - disabling every option (and forcing nothing) would leave the
  // control unusable. When it's absent, updateCursorUI's PROB_HML_GAP message
  // explains why nothing is shown instead.
  const probAvailable = Object.prototype.hasOwnProperty.call(MODELS, PROB_ONLY_MODEL);

  if (mode === "cloudProb" && probAvailable) {
    if (!wasForced) modelBeforeProbForce = selectedModelId; // remember for when we leave
    Array.from(modelSelect.options).forEach(o => { o.disabled = o.value !== PROB_ONLY_MODEL; });
    if (selectedModelId !== PROB_ONLY_MODEL) {
      switchModel(PROB_ONLY_MODEL); // ends in updateCursorUI via selectRun
      return;
    }
  } else {
    Array.from(modelSelect.options).forEach(o => { o.disabled = false; });
    const restore = modelBeforeProbForce;
    modelBeforeProbForce = null;
    if (wasForced && restore && restore !== selectedModelId && MODELS[restore]) {
      switchModel(restore); // ends in updateCursorUI via selectRun
      return;
    }
  }
  updateCursorUI();
}

function updateCursorUI() {
  const trackRect = axisTrack.getBoundingClientRect();
  const wrapRect = stackWrap.getBoundingClientRect();
  const trackOffsetPx = trackRect.left - wrapRect.left;
  const leftPx = trackOffsetPx + timeToPx(cursorTime, trackRect.width);
  cursorLine.style.left = Math.round(leftPx) + "px";
  cursorReadout.textContent = "cursor " + fmtTime(cursorTime);

  builtRows.forEach(({ run, track }, idx) => {
    const nearest = nearestStep(run, cursorTime);
    track.querySelectorAll(".tick").forEach(tickEl => {
      tickEl.classList.toggle("near", parseFloat(tickEl.dataset.hour) === nearest);
    });
  });

  // The rain checkbox is independent of the radios and deliberately changes
  // nothing about the displayed image - it only says so.
  placeholderNote.textContent = rainOn ? "rain overlay: not yet implemented" : "";

  if (selectedRunIdx === null || !builtRows[selectedRunIdx]) {
    setMapTag("select a run");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = "";
    mapAreaSub.textContent = "—";
    return;
  }

  const { run } = builtRows[selectedRunIdx];
  const step = nearestStep(run, cursorTime);

  if (quantityMode === "temp") {
    setMapTag("not available");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = MODELS[selectedModelId].label;
    mapAreaSub.textContent = "temperature: not yet implemented";
    return;
  }

  const images = step === null ? null : run.imagesByStep[step];
  const hasDataFlags = step === null ? null : run.hasDataByStep[step];
  const field = resolveField(images, hasDataFlags, quantityMode);
  const url = field ? images[field] : null;

  mapAreaTitle.textContent = MODELS[selectedModelId].label + " · run " + fmtTime(run.runInit);
  if (url) {
    setMapTag("");
    mapAreaImg.src = url;
    mapAreaImg.style.display = "block";
    mapAreaSub.textContent = "step +" + step + "h  ·  valid " + fmtTime(stepValidTime(run, step)) + "  ·  field: " + field;
  } else {
    setMapTag("not available");
    mapAreaImg.style.display = "none";
    mapAreaSub.textContent = step === null
      ? "no step available"
      : (modelSupportsMode(selectedModelId, quantityMode)
          ? "no rendered frame for this step"
          : PROB_HML_GAP);
  }
}

function timeFromClientX(clientX) {
  const rect = axisTrack.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  return new Date(AXIS_START.getTime() + frac * axisRightMs);
}

// Two independent drag handles, each only grabbable near its OWN current
// position: the vertical (time) cursor horizontally, the horizontal (row)
// cursor vertically - the latter has no drawn line, the row highlight IS
// its visual. Clicking away from both still jumps both immediately (today's
// behavior); dragging only "sticks" to a handle grabbed within its hit zone.
const CURSOR_HIT_PX = 8;   // horizontal tolerance around the vertical cursor line
const ROW_HIT_PAD_PX = 6;  // vertical tolerance around the selected row's own band
const CURSOR_HIT_PX_TOUCH = 20;  // same, widened for a finger instead of a mouse pointer
const ROW_HIT_PAD_PX_TOUCH = 16;

function isNearCursorLine(clientX) {
  const rect = cursorLine.getBoundingClientRect();
  const tol = isTouch ? CURSOR_HIT_PX_TOUCH : CURSOR_HIT_PX;
  return Math.abs(clientX - (rect.left + rect.width / 2)) <= tol;
}

function isNearSelectedRow(clientY) {
  if (selectedRunIdx === null || !builtRows[selectedRunIdx]) return false;
  const r = builtRows[selectedRunIdx].row.getBoundingClientRect();
  const pad = isTouch ? ROW_HIT_PAD_PX_TOUCH : ROW_HIT_PAD_PX;
  return clientY >= r.top - pad && clientY <= r.bottom + pad;
}

function rowIndexAtClientY(clientY) {
  if (!builtRows.length) return null;
  for (let i = 0; i < builtRows.length; i++) {
    const r = builtRows[i].row.getBoundingClientRect();
    if (clientY >= r.top && clientY <= r.bottom) return i;
  }
  if (clientY < builtRows[0].row.getBoundingClientRect().top) return 0;
  if (clientY > builtRows[builtRows.length - 1].row.getBoundingClientRect().bottom) return builtRows.length - 1;
  return null;
}

// Precedence: the vertical (time) cursor wins where both hit zones overlap.
function hitZoneAt(clientX, clientY) {
  if (isNearCursorLine(clientX)) return "time";
  if (isNearSelectedRow(clientY)) return "row";
  return null;
}

function applyHoverHint(clientX, clientY) {
  const zone = hitZoneAt(clientX, clientY);
  stackWrap.classList.toggle("hint-time", zone === "time");
  stackWrap.classList.toggle("hint-row", zone === "row");
}

let dragMode = null; // "time" | "row" | null (a plain click, no continued drag-follow)
let isTouch = false; // true while the current interaction is touch-driven - widens hit tolerances

function startDrag(clientX, clientY) {
  dragMode = hitZoneAt(clientX, clientY);
  if (dragMode === "time") {
    cursorTime = timeFromClientX(clientX);
    updateCursorUI();
  } else if (dragMode === "row") {
    const idx = rowIndexAtClientY(clientY);
    if (idx !== null) selectRun(idx);
  } else {
    // Away from both handles: plain click still jumps both, same as before.
    cursorTime = timeFromClientX(clientX);
    const idx = rowIndexAtClientY(clientY);
    if (idx !== null) selectRun(idx); else updateCursorUI();
  }
  applyHoverHint(clientX, clientY);
}

function moveDrag(clientX, clientY) {
  if (dragMode === "time") {
    cursorTime = timeFromClientX(clientX);
    updateCursorUI();
  } else if (dragMode === "row") {
    const idx = rowIndexAtClientY(clientY);
    if (idx !== null && idx !== selectedRunIdx) selectRun(idx);
  }
  applyHoverHint(clientX, clientY);
}

function endDrag() { dragMode = null; isTouch = false; }

// The label column has no meaningful position on the time axis - it sits to
// the LEFT of axisTrack, so timeFromClientX() would clamp it to frac=0 (the
// axis start). Clicking it must therefore only ever switch runs, never
// touch cursorTime - unlike the general "click away from both handles jumps
// both" behavior everywhere else in the row (see startDrag's else branch).
function handleLabelPointerDown(target, clientX, clientY) {
  const label = target.closest(".rowLabel");
  if (!label) return false;
  const idx = rowIndexAtClientY(clientY);
  if (idx !== null) selectRun(idx);
  // Starting on the label still begins a row-drag - moveDrag's "row" branch
  // only ever looks at clientY, so continuing to drag up/down from here
  // switches runs same as starting from the track, it just never touches
  // cursorTime the way starting from elsewhere in a non-selected row would.
  dragMode = "row";
  applyHoverHint(clientX, clientY);
  return true;
}

stackWrap.addEventListener("mousedown", e => {
  if (e.target.closest(".preloadBtn")) return;
  isTouch = false;
  if (handleLabelPointerDown(e.target, e.clientX, e.clientY)) return;
  startDrag(e.clientX, e.clientY);
});
window.addEventListener("mousemove", e => moveDrag(e.clientX, e.clientY));
window.addEventListener("mouseup", endDrag);

// Touch: same startDrag/moveDrag/endDrag as mouse, same attachment points
// (touchstart on stackWrap only, touchmove/touchend on window so a drag that
// leaves stackWrap's bounds is still tracked) - just fed touch coordinates.
stackWrap.addEventListener("touchstart", e => {
  if (e.target.closest(".preloadBtn")) return;
  const t = e.touches[0];
  if (!t) return;
  isTouch = true;
  if (handleLabelPointerDown(e.target, t.clientX, t.clientY)) return;
  startDrag(t.clientX, t.clientY);
  // No preventDefault here: an off-handle tap must still fall through to the
  // "click away still jumps both" behavior, and must not block page scroll.
});
window.addEventListener("touchmove", e => {
  const t = e.touches[0];
  if (!t) return;
  moveDrag(t.clientX, t.clientY);
  // Only swallow the scroll/zoom gesture once a real handle drag is underway.
  if (dragMode) e.preventDefault();
}, { passive: false });
window.addEventListener("touchend", endDrag);
window.addEventListener("touchcancel", endDrag);
quantityRadios.forEach(r => r.addEventListener("change", () => {
  if (r.checked) applyQuantityMode(r.value);
}));
rainCheckbox.addEventListener("change", () => {
  rainOn = rainCheckbox.checked;
  updateCursorUI();
});
modelSelect.addEventListener("change", () => loadModel(modelSelect.value));

function advanceStep(direction) {
  if (selectedRunIdx === null || !builtRows[selectedRunIdx]) return;
  const run = builtRows[selectedRunIdx].run;
  const visible = run.steps
    .filter(h => stepValidTime(run, h) - AXIS_START <= axisRightMs)
    .sort((a, b) => a - b);
  if (!visible.length) return;
  const current = nearestStep(run, cursorTime);
  const currentIndex = current === null ? -1 : visible.indexOf(current);
  const nextIndex = Math.min(visible.length - 1, Math.max(0, currentIndex + direction));
  cursorTime = stepValidTime(run, visible[nextIndex]);
  updateCursorUI();
}

function advanceRun(direction) {
  if (!builtRows.length) return;
  const currentIndex = selectedRunIdx === null ? -1 : selectedRunIdx;
  const nextIndex = Math.min(builtRows.length - 1, Math.max(0, currentIndex + direction));
  selectRun(nextIndex);
}

const _ARROW_KEYS = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"];

window.addEventListener("keydown", e => {
  if (!_ARROW_KEYS.includes(e.key)) return;
  // Don't hijack arrow keys while the user is operating a focused control
  // (the model select, the quantity radios and the extent slider all have
  // their own native arrow-key behavior).
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  e.preventDefault();
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    advanceStep(e.key === "ArrowRight" ? 1 : -1);
  } else {
    // builtRows is newest-on-top - Up moves to the newer/previous row,
    // Down to the older/next one, matching visual top-to-bottom order.
    advanceRun(e.key === "ArrowDown" ? 1 : -1);
  }
});

extentInput.addEventListener("input", () => {
  axisRightMs = parseInt(extentInput.value, 10);
  const spanH = axisRightMs / 3600000;
  extentReadout.textContent = spanH < 48 ? spanH.toFixed(0) + "h" : (spanH / 24).toFixed(1) + "d";
  cursorTime = new Date(Math.min(cursorTime.getTime(), AXIS_START.getTime() + axisRightMs));
  layoutTicks();
  updateCursorUI();
});

let resizePending = false;
window.addEventListener("resize", () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => {
    layoutTicks();
    updateCursorUI();
    resizePending = false;
  });
});

loadManifest()
  .then(() => {
    populateModelSelect();
    loadModel(modelSelect.value);
    // Browsers (Firefox in particular) restore radio/checkbox state across a
    // soft reload, so the DOM can already disagree with the defaults declared
    // above - adopt whatever is actually checked instead of assuming Cloud
    // cover, or the model lock and the visible selection would drift apart.
    rainOn = rainCheckbox.checked;
    const checkedQuantity = document.querySelector('input[name="quantityMode"]:checked');
    applyQuantityMode(checkedQuantity ? checkedQuantity.value : "cloudCover");
  })
  .catch(err => {
    document.body.innerHTML = "<pre style='color:#8b3a2f'>failed to load tool2_manifest.json: " + err + "</pre>";
    console.error(err);
  });
</script>
</body>
</html>
