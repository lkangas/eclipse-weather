<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool 3 — eclipse valid-time, all models, run-init slider (real data)</title>
<style>
  /* Tool ribbon - the three tools are one product and were reachable only by
     knowing each other's URL. Sits above everything, styled as navigation
     rather than as another control so it does not compete with the row of
     actual controls below it. */
  .toolbar { display:flex; gap:0; align-items:stretch; margin: 0 0 6px;
             border-bottom:1px solid #d8d4c8; }
  .toolbar a { font: 11px/1 ui-monospace, "SF Mono", Consolas, monospace;
               text-decoration:none; color:#7a776c; padding:7px 13px;
               border:1px solid transparent; border-bottom:none;
               letter-spacing:.03em; }
  .toolbar a:hover { color:#232320; background:#efece3; }
  .toolbar a.here { color:#232320; font-weight:700; background:#fffdf8;
                    border-color:#d8d4c8; border-bottom:1px solid #fffdf8;
                    margin-bottom:-1px; }
  html, body { height: 100%; }
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    background: #f6f4ef;
    color: #232320;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* #mapArea / #gallery below are the flexible elements
      that absorb whatever room is left after controls+slider+legend - see
      their own comments. Same layout approach as newest_runs.html /
      compare_runs.html. */
  }
  .controls {
    display: flex;
    align-items: center;
    /* Wrap, unlike newest_runs.html's single-line bar: this row now carries the
       quantity radios AND the target radios AND the view toggle, which is
       wider than a 1280px viewport - without wrapping, #cursorReadout (pushed
       right by its margin-left:auto) is simply clipped by body's
       overflow:hidden. A wrapped second line just makes the fixed-height
       controls block taller; #gallery/#mapArea absorb the difference. */
    flex-wrap: wrap;
    gap: 18px;
    row-gap: 4px; /* after the `gap` shorthand, which would otherwise reset it */
    margin-bottom: 4px;
    font-size: 11.5px;
    border-bottom: 1px solid #d8d4c8;
    padding: 4px 6px;
    flex: none;
  }
  .controls label {
    color: #7a776c;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 9.5px;
  }
  select {
    background: #fff;
    color: #232320;
    border: 1px solid #232320;
    border-radius: 0;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 11.5px;
  }
  /* newest_runs.html's .quantityGroup look, shared with Tool 3's own target
     switch - both are the same kind of "pick one of N modes" control, so they
     share one rule set rather than inventing a second control style. */
  .quantityGroup, .targetGroup { display: flex; align-items: center; gap: 10px; }
  .quantityGroup .opt, .targetGroup .opt {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #232320;
    cursor: pointer;
    white-space: nowrap;
  }
  .quantityGroup input[type=radio], .targetGroup input[type=radio] { accent-color: #8b3a2f; }
  /* Rain is an independent overlay toggle, not one of the quantities - the
     rule separates it from the radios visually. */
  .rainOpt {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #232320;
    cursor: pointer;
    padding-left: 8px;
    border-left: 1px solid #d8d4c8;
  }
  .rainOpt input[type=checkbox] { accent-color: #2f5f8b; }
  .placeholderNote { font-size: 9.5px; color: #a8a498; font-style: italic; }
  /* Cloud prob. mode: rows here ARE models, and only one model has prob data,
     so every other row is greyed and unclickable - exactly newest_runs.html's
     .row.disabled. pointer-events:none also lets a drag started over a greyed
     row fall through to #stackWrap, so time-scrubbing still works there. */
  .row.disabled { pointer-events: none; opacity: 0.35; }
  /* The simulated target moves on every manifest generation, so its actual
     valid time has to be on screen - "Simulated (+3d)" alone doesn't say
     which moment that is. */
  #targetReadout { font-variant-numeric: tabular-nums; color: #55534c; white-space: nowrap; }
  #extentInput { width: 150px; accent-color: #8b3a2f; vertical-align: middle; }
  #extentReadout { font-variant-numeric: tabular-nums; color: #55534c; margin-left: 4px; white-space: nowrap; }
  .viewToggle { display: flex; border: 1px solid #232320; }
  .viewToggle button {
    font-family: inherit;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: #fff;
    color: #7a776c;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
  }
  .viewToggle button + button { border-left: 1px solid #232320; }
  .viewToggle button.active { background: #232320; color: #f6f4ef; }
  #cursorReadout {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    color: #8b3a2f;
    font-weight: 600;
    white-space: nowrap;
  }
  #stackWrap {
    position: relative;
    border: 1px solid #232320;
    background: #fff;
    padding: 3px 14px 3px 0;
    user-select: none;
    flex: none; /* fixed content height - #mapArea/#gallery are the flexible ones */
    cursor: ew-resize;
    touch-action: none;
  }
  /* ew-resize, not pointer: a row click both jumps the shared time cursor
     AND selects that model in single-row view (see script - no proximity
     gating), and rows cover almost the entire #stackWrap area, so their own
     cursor was masking #stackWrap's ew-resize above for nearly every pixel.
     .row:hover below already covers "this row is clickable". */
  .row { display: flex; align-items: center; height: 15px; cursor: ew-resize; }
  .row:hover { background: #f6f4ef; }
  .row.clicked { background: #f0e8d2; }
  .rowLabel {
    width: 100px;
    flex: none;
    font-size: 9.5px;
    color: #55534c;
    padding-left: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.clicked .rowLabel { color: #232320; font-weight: 700; }
  .rowTrack { position: relative; flex: 1; height: 100%; }
  /* Coverage is the whole question this tool asks, and right now 2 runs of 245
     reach the eclipse - only gefs_extended has the range. So the covering ones
     have to be findable among two hundred that are not, which means the
     defaults invert: a non-covering tick is faint background context, and a
     covering tick is loud.
     The history is kept rather than filtered out because watching coverage
     ARRIVE over the next fortnight is the thing worth seeing, and that needs
     the runs which do not reach it yet as the backdrop. */
  .tick { position: absolute; top: 5px; width: 2px; height: 6px; background: #cfcabb; }
  .tick.noCoverage { background: #e2ded2; }
  .row.clicked .tick { background: #b09a72; }
  .tick.near { width: 3px; height: 15px; top: 0; background: #8b3a2f; }
  .tick.near.noCoverage { background: #c99; }
  /* After .near and .row.clicked so it wins on equal specificity: a covering
     run must not stop looking like one because its row is selected. */
  .tick.covers, .row.clicked .tick.covers {
    top: 0; width: 4px; height: 16px; background: #2f6f3f; border-radius: 1px;
    box-shadow: 0 0 0 1px #f6f4ef; z-index: 3;
  }
  /* Nearest-to-cursor keeps its red cue as an outline instead of a repaint,
     so "covers" and "nearest" can be true at once. */
  .tick.covers.near { box-shadow: 0 0 0 2px #8b3a2f; }
  #cursorLine {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: #8b3a2f; pointer-events: none; z-index: 5;
  }
  #cursorHandle {
    position: absolute; top: -7px; width: 0; height: 0; margin-left: -5px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 7px solid #8b3a2f; z-index: 6;
  }
  /* Identical to #eclipseLine in newest_runs.html and compare_runs.html - the
     eclipse is one moment and should look the same wherever it is drawn. It
     was a solid 1px #5a4a8b here and a dashed 2px #6a2fa0 there, so the same
     instant read as two different things across the three tools.
     Note this line marks the SELECTED target, which is the eclipse by default
     but becomes the simulated time when toggled - hence .isSim below, which
     keeps the geometry and drops the eclipse colour so the two are never
     confused. */
  #eclipseLine {
    position: absolute; top: 0; bottom: 0; width: 2px;
    margin-left: -1px; /* centre the 2px band on the computed pixel */
    background: repeating-linear-gradient(to bottom, #6a2fa0 0 4px, transparent 4px 8px);
    pointer-events: none; z-index: 4;
  }
  #eclipseLine.isSim {
    background: repeating-linear-gradient(to bottom, #7a776c 0 4px, transparent 4px 8px);
  }
  #eclipseLine .tag {
    position: absolute; top: -14px; left: 3px; font-size: 8.5px; color: #6a2fa0;
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em;
  }
  #eclipseLine.isSim .tag { color: #7a776c; }
  #eclipseLine.flip .tag { left: auto; right: 3px; }
  /* Wider + lower z-index than the cursor/eclipse lines on purpose: if the
     draggable cursor (1px, z-index 5) ever sits exactly on "now" (its own
     default position), this wider translucent band still shows around it
     instead of being fully occluded. */
  #nowLine {
    position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -2px;
    background: rgba(47, 111, 63, 0.4); pointer-events: none; z-index: 3;
  }
  #axisRow { display: flex; align-items: center; height: 14px; margin-top: 3px; border-top: 1px solid #232320; }
  #axisRow .rowLabel { visibility: hidden; }
  .axisTick { position: absolute; top: 3px; font-size: 9px; color: #7a776c; transform: translateX(-50%); white-space: nowrap; }
  .legend { font-size: 9.5px; color: #7a776c; margin-top: 4px; flex: none; }
  .legend span { margin-right: 16px; }
  .legend .sw { display: inline-block; width: 9px; height: 9px; vertical-align: -1px; margin-right: 3px; }

  /* Shown when NOT ONE archived run of ANY model reaches the selected target
     valid time - the normal state of the real-eclipse target today. Without
     it every panel below would just say "not yet covering" with no hint that
     this is expected rather than a broken tool. flex:none so it never eats
     the room #gallery/#mapArea need. */

  #mapArea {
    margin-top: 2px; border: 1px solid #232320; background: #fff;
    flex: 1;    /* absorbs whatever vertical room is left below the
      fixed-size controls/slider/legend above - same layout approach as
      newest_runs.html / compare_runs.html. */
    min-height: 80px; /* just enough for the placeholder/error text to stay
      legible on a very cramped viewport - not a target size. */
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px; color: #7a776c; font-size: 12px;
    padding: 6px; box-sizing: border-box;
  }
  #mapArea .big { font-size: 14px; color: #232320; font-weight: 700; }
  #mapArea .placeholder-tag { font-size: 9.5px; color: #a8a498; text-transform: uppercase; letter-spacing: 0.09em; }
  #mapAreaImg {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    object-fit: contain;
    display: none;
  }

  /* The gallery is the OTHER flexible element - only one of #gallery /
     #mapArea is ever displayed at a time (see setViewMode), so both claim
     flex:1. Unlike #mapArea (a single image that scales to fit) the gallery
     is an N-cell grid that can genuinely need more room than the viewport
     has, so it scrolls internally rather than being clipped by body's
     overflow:hidden. */
  #gallery {
    margin-top: 2px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    align-content: start;
    padding: 2px;
    box-sizing: border-box;
  }
  .galleryCell {
    border: 1px solid #232320;
    background: #fff;
    min-height: 140px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
    color: #7a776c;
  }
  .galleryCell .cellTitle { font-weight: 700; color: #232320; font-size: 10.5px; }
  /* Rain ships as its own transparent PNG rather than baked into the base
     frame, so it overlays any base (cloud composite, total, temp) without a
     frame per combination. Registration is free - same bbox, same size - as
     long as the two <img> resolve to the same box, hence one shared sizing
     rule and object-fit: contain on each. */
  .imgStack { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; }
  .galleryCell .cellImg, .galleryCell .cellRainImg {
    width: 100%; height: 100%; object-fit: contain; display: none;
  }
  .galleryCell .cellRainImg { position: absolute; inset: 0; pointer-events: none; }
  #mapAreaStack { position: relative; flex: 1 1 0; min-height: 0; display: flex; justify-content: center; }
  #mapAreaRainImg {
    position: absolute; inset: 0; margin: auto;
    max-width: 100%; max-height: 100%; width: auto;
    object-fit: contain; display: none; pointer-events: none;
  }
  /* Disabled, not merely inert, where the model has no rain data - a live
     checkbox that does nothing makes "no rain forecast" and "this model
     cannot do rain" look the same. */
  .rainOpt.disabled { opacity: 0.4; }
  .galleryCell .cellBody {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #a8a498;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px dashed #d8d4c8;
  }
  .galleryCell.noCoverage .cellBody { color: #c99; border-color: #e6c9c9; }
  /* The quantity simply doesn't exist for this model (Cloud prob. on a
     non-ensemble, or Temp on anything) - dimmed so the gallery reads as
     "these can't answer" at a glance, rather than as broken cells. */
  .galleryCell.unsupported { opacity: 0.5; }

  /* Touch-target bump for coarse pointers only (fingers, not mice) - keeps
     desktop mouse users pixel-identical to before. .row is 15px tall (fine
     for a mouse click) but under the ~20px minimum comfortable tap target;
     the viewToggle buttons are already close to that floor. Ticks inside
     .rowTrack are absolutely positioned (top:3px height:9px) so a taller
     row just adds blank space below them - harmless, no relayout needed. */
  @media (pointer: coarse) {
    .row { height: 22px; }
    .viewToggle button { padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <a href="index.html">Newest runs</a>
  <a href="compare-runs.html">Compare runs</a>
  <a href="at-eclipse.html" class="here">At eclipse</a>
  <a href="pipeline.html">Pipeline</a>
</div>

<div class="controls">
  <div class="quantityGroup" id="quantityGroup">
    <label style="margin-right:0">Quantity</label>
    <label class="opt"><input type="radio" name="quantityMode" value="temp"> Temp</label>
    <label class="opt"><input type="radio" name="quantityMode" value="cloudCover" checked> Cloud cover</label>
    <label class="opt"><input type="radio" name="quantityMode" value="cloudProb"> Cloud prob.</label>
  </div>
  <label class="rainOpt"><input type="checkbox" id="rainCheckbox"> Rain</label>
  <span class="placeholderNote" id="placeholderNote"></span>
  <!-- Radios + the readout are built from the manifest's own targets[] in
       buildTargetToggle() - labels and count are never hardcoded here. -->
  <div class="targetGroup" id="targetGroup"></div>
  <div>
    <label for="extentInput">Extent</label>
    <input type="range" id="extentInput" min="0" max="100" value="100">
    <span id="extentReadout">—</span>
  </div>
  <div class="viewToggle">
    <button id="viewGalleryBtn" class="active">All models</button>
    <button id="viewSingleBtn">Clicked row</button>
  </div>
  <div id="cursorReadout">—</div>
</div>

<div id="stackWrap">
  <div id="rows"></div>
  <div id="axisRow"><div class="rowLabel"></div><div class="rowTrack" id="axisTrack"></div></div>
  <div id="eclipseLine"><div class="tag" id="eclipseTag">target T</div></div>
  <div id="nowLine"></div>
  <div id="cursorLine"><div id="cursorHandle"></div></div>
</div>

<div class="legend">
  <span><span class="sw" style="background:#a19e92"></span>archived run</span>
  <span><span class="sw" style="background:#d8d4c8"></span><span id="legendNoCoverage">run doesn't reach target T yet</span></span>
  <span><span class="sw" style="background:#8b3a2f"></span>nearest to cursor</span>
  <span><span class="sw" style="background:#5a4a8b"></span><span id="legendTarget">target T</span></span>
  <span><span class="sw" style="background:#2f6f3f;opacity:.6"></span>now</span>
</div>

<div id="mapArea" style="display:none;">
  <div class="placeholder-tag" id="mapAreaTag">click a row</div>
  <div id="mapAreaStack">
    <img id="mapAreaImg" alt="">
    <img id="mapAreaRainImg" alt="">
  </div>
  <div class="big" id="mapAreaTitle"></div>
  <div id="mapAreaSub">—</div>
</div>

<div id="gallery"></div>

<script>
// ---------------------------------------------------------------------------
// Real data via tool3_manifest.json (scripts/generate_tool3_manifest.py).
// The manifest carries SEVERAL target valid times (currently the real
// 2026-08-12 eclipse, which today's archive can't reach yet for any model,
// and a rolling "+3d" simulated one that real archived runs do cover) and
// says which to start on via default_target. Each run therefore carries one
// coverage entry PER target under run.by_target - see targetData() below.
// ---------------------------------------------------------------------------
const NOW = new Date();
let TARGETS = [];            // [{key, label, validTime}] straight from the manifest
let currentTarget = null;    // key into each run's byTarget map
let TARGET_VALID_TIME = new Date(); // == currentTargetInfo().validTime, kept in sync by setTarget
let MODELS = []; // [{id, label, runs: [{runInit, byTarget: {key: {covers, step, ...}}}]}]

// Known, permanent (not-a-bug) field gap - same fact already documented in
// newest_runs.html/compare_runs.html.
// Cloud probability (per-pixel, not the pooled point metric T32 uses for
// site ranking) is a per-grid-cell ensemble spread metric - only meaningful
// for a model with genuine multi-member native low/mid/high data. Right now
// that's aifs_ens only; aifs_single is deterministic (a single run has no
// member spread to compute a P() from), so it gets this message rather than a
// degenerate binary map.
//
// This replaces the old per-model/per-field KNOWN_FIELD_GAPS table: with
// `total` no longer a user-selectable quantity (it's the FALLBACK for models
// with no native low/mid/high - see resolveField), the only remaining gap is
// "this model isn't the prob-capable ensemble", which PROB_ONLY_MODEL below
// already states once instead of nine times.
const PROB_HML_GAP = "Needs an ensemble with native low/mid/high cloud - only AIFS ENS currently qualifies";
const PROB_ONLY_MODEL = "aifs_ens";

async function loadManifest() {
  const resp = await fetch("tool3_manifest.json");
  if (!resp.ok) throw new Error("tool3_manifest.json fetch failed: HTTP " + resp.status);
  const manifest = await resp.json();

  TARGETS = (manifest.targets || []).map(t => ({
    key: t.key, label: t.label, validTime: new Date(t.valid_time),
  }));
  if (!TARGETS.length) throw new Error("tool3_manifest.json has no targets[]");
  // default_target is the generator's opinion about which target is useful
  // TODAY (it flips to the real eclipse once runs reach it); fall back to the
  // first target if it ever names one that isn't in the list.
  currentTarget = TARGETS.some(t => t.key === manifest.default_target)
    ? manifest.default_target
    : TARGETS[0].key;
  TARGET_VALID_TIME = TARGETS.find(t => t.key === currentTarget).validTime;

  // Note what is NOT read per target here: the run list itself. Which runs
  // exist is a fact about what's rendered on disk, identical for every
  // target, which is exactly why toggling can leave rows and ticks in place.
  MODELS = manifest.models.map(m => ({
    id: m.id,
    label: m.label,
    runs: m.runs.map(r => ({
      runInit: new Date(r.run_init),
      byTarget: r.by_target || {},
    })),
  }));
}

// Everything the manifest says ABOUT a run at a valid time - covers, step,
// misalignment_h, images, has_data - lives under run.by_target[<key>]. Every
// read goes through here so switching target is a pure data swap; reading
// those fields off the run itself would silently see undefined.
const NO_TARGET_DATA = { covers: false, step: null, misalignmentH: null, images: null, hasData: null };

function targetData(run) {
  const t = run.byTarget[currentTarget];
  if (!t) return NO_TARGET_DATA; // target the generator didn't emit for this run
  return {
    covers: !!t.covers,
    step: t.step,
    misalignmentH: t.misalignment_h,
    images: t.images,
    hasData: t.has_data,
  };
}

function currentTargetInfo() {
  return TARGETS.find(t => t.key === currentTarget) || null;
}

// Is field f actually displayable for this run/target? An image URL is always
// written even when the underlying data is missing (a "(no data)" placeholder
// frame), so has_data is what decides - but newer manifests simply omit the
// field instead, and a manifest predating has_data has none at all, hence
// "assume real unless explicitly false".
function fieldHasData(images, hasData, f) {
  if (!images || !images[f]) return false;
  return hasData ? hasData[f] !== false : true;
}

// Which field to actually display for the current quantityMode. `total` is
// NOT a user-selectable quantity - it's the FALLBACK for the models with no
// native low/mid/high to build a composite from (ecmwf_hres/ecmwf_ens). Cloud
// prob has no fallback: prob_total is deliberately never rendered, and only
// aifs_ens has prob data at all. Same resolution as newest_runs.html's
// resolveField(); the images/hasData it works on always come from
// targetData(run), so it composes with the target toggle for free.
function resolveField(images, hasData, mode) {
  if (mode === "cloudCover") {
    if (fieldHasData(images, hasData, "hml_composite")) return "hml_composite";
    if (fieldHasData(images, hasData, "total")) return "total";
    return null;
  }
  if (mode === "cloudProb") {
    return fieldHasData(images, hasData, "prob_hml_composite") ? "prob_hml_composite" : null;
  }
  if (mode === "temp") {
    return fieldHasData(images, hasData, "temp") ? "temp" : null;
  }
  return null;
}

// Can this model answer the current quantity AT ALL (regardless of run or
// target)? Cloud cover always can - every model has either a composite or a
// total. Cloud prob needs the one prob-capable ensemble. Temp is now real for
// every gridded model, so it is answered from the manifest rather than
// hard-coded false: a model whose frames have not been rendered yet must read
// as "not there yet", not as "unsupported".
function modelSupportsMode(modelId, mode) {
  if (mode === "temp") {
    const m = MODELS.find(x => x.id === modelId);
    return !!(m && m.runs.some(r => Object.values(r.byTarget || {})
      .some(t => (t.images || {}).temp)));
  }
  if (mode === "cloudProb") return modelId === PROB_ONLY_MODEL;
  return true;
}
// ---------------------------------------------------------------------------

let AXIS_START, AXIS_END, axisRightMs;
let cursorTime = new Date(NOW);
let clickedRowIdx = null;
let viewMode = "gallery"; // "gallery" | "single"

// Quantity is a 3-way radio (temp/cloudCover/cloudProb) + an independent rain
// overlay checkbox - identical control to newest_runs.html's. NOT a field name:
// which field backs cloudCover differs per model (see resolveField). Temp and
// the rain overlay are both placeholders (no real data path yet).
let quantityMode = "cloudCover";
let rainOn = false;
// Rows here ARE models (the horizontal axis is run-init time), so Cloud prob
// locks the selection the same way newest_runs.html does: grey every row but
// the prob-capable one and force-select it. This remembers which row was
// clicked before, so leaving Cloud prob restores it instead of stranding you
// on AIFS ENS.
let rowBeforeProbForce = null;

const rowsEl = document.getElementById("rows");
const axisTrack = document.getElementById("axisTrack");
const stackWrap = document.getElementById("stackWrap");
const cursorLine = document.getElementById("cursorLine");
const cursorReadout = document.getElementById("cursorReadout");
const eclipseLine = document.getElementById("eclipseLine");
const eclipseTag = document.getElementById("eclipseTag");
const nowLine = document.getElementById("nowLine");
const targetGroup = document.getElementById("targetGroup");
const legendNoCoverage = document.getElementById("legendNoCoverage");
const legendTarget = document.getElementById("legendTarget");
const quantityRadios = document.querySelectorAll('input[name="quantityMode"]');
const rainCheckbox = document.getElementById("rainCheckbox");
const mapAreaRainImg = document.getElementById("mapAreaRainImg");
const placeholderNote = document.getElementById("placeholderNote");
const extentInput = document.getElementById("extentInput");
const extentReadout = document.getElementById("extentReadout");
const viewGalleryBtn = document.getElementById("viewGalleryBtn");
const viewSingleBtn = document.getElementById("viewSingleBtn");
const mapArea = document.getElementById("mapArea");
const mapAreaTag = document.getElementById("mapAreaTag");
// A real, successfully-rendered frame needs no banner - the image speaks
// for itself. Collapsed via display:none (not just an empty string) so it
// doesn't leave behind an empty line's worth of vertical space/gap.
function setMapTag(text) {
  mapAreaTag.textContent = text;
  mapAreaTag.style.display = text ? "" : "none";
}
const mapAreaImg = document.getElementById("mapAreaImg");
const mapAreaTitle = document.getElementById("mapAreaTitle");
const mapAreaSub = document.getElementById("mapAreaSub");
const galleryEl = document.getElementById("gallery");

let builtRows = []; // [{model, row, track, ticks: [{run, el}]}]
let galleryCells = []; // [{model, cell, titleEl, bodyEl}]
let targetReadout = null; // built by buildTargetToggle()

function fmtTime(d) { return d.toISOString().slice(0, 16).replace("T", " ") + "Z"; }
function fmtDuration(ms) {
  const h = ms / 3600000;
  return h < 48 ? h.toFixed(0) + "h" : (h / 24).toFixed(1) + "d";
}

function buildTargetToggle() {
  targetGroup.innerHTML = "";
  const heading = document.createElement("label");
  heading.textContent = "Target";
  heading.style.marginRight = "0";
  targetGroup.appendChild(heading);

  TARGETS.forEach(t => {
    const opt = document.createElement("label");
    opt.className = "opt";
    opt.title = "valid " + fmtTime(t.validTime);
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "targetKey";
    input.value = t.key;
    input.checked = t.key === currentTarget;
    input.addEventListener("change", () => { if (input.checked) setTarget(t.key); });
    opt.appendChild(input);
    opt.appendChild(document.createTextNode(t.label));
    targetGroup.appendChild(opt);
  });

  targetReadout = document.createElement("span");
  targetReadout.id = "targetReadout";
  targetGroup.appendChild(targetReadout);
}

// Four places name the current target (the axis marker's tag, two legend
// entries, the readout next to the radios). All of them take the manifest's
// own label, so adding or renaming a target needs no change here.
function syncTargetLabels() {
  const info = currentTargetInfo();
  const label = info ? info.label : "target";
  eclipseTag.textContent = label + " T";
  legendTarget.textContent = label + " T";
  legendNoCoverage.textContent = "run doesn't reach " + label + " T yet";
  if (targetReadout) targetReadout.textContent = info ? "valid " + fmtTime(info.validTime) : "—";
}

function setTarget(key) {
  currentTarget = key;
  const info = currentTargetInfo();
  if (info) TARGET_VALID_TIME = info.validTime;
  syncTargetLabels();
  // Deliberately NOT layoutTicks(): which runs exist, and therefore every
  // tick's x-position and every row, are target-independent. The toggle only
  // repaints each tick's coverage colour and moves the target marker, so the
  // stack stays visually anchored while switching.
  refreshTickCoverage();
  placeMarkers();
  updateUI();
}

function init() {
  const allRunInits = MODELS.flatMap(m => m.runs.map(r => r.runInit.getTime()));
  AXIS_START = new Date(Math.min(...allRunInits));
  // Reach the FARTHEST target - the eclipse itself - so its marker is always
  // on the axis. Previously this stopped at the nearest target, which kept the
  // run history readable but meant the one date the tool exists for was simply
  // off-screen and placeMarkers() hid it.
  //
  // The cost is real: the eclipse is weeks past every archived run, so at full
  // extent the run-init history compresses to the left edge. That is what the
  // extent slider is for - it sets the visible right edge, so dragging it in
  // zooms back onto the runs. Taking the farthest target rather than the
  // SELECTED one also keeps the axis stable when toggling eclipse/sim, which
  // would otherwise reflow every tick underneath you.
  const farthestTargetMs = Math.max(...TARGETS.map(t => t.validTime.getTime()));
  AXIS_END = new Date(Math.max(farthestTargetMs + 12 * 3600 * 1000, ...allRunInits));
  const fullSpanMs = AXIS_END - AXIS_START;
  axisRightMs = fullSpanMs;
  extentInput.min = 0;
  extentInput.max = fullSpanMs;
  extentInput.step = 3600 * 1000;
  extentInput.value = fullSpanMs;
  extentReadout.textContent = fmtDuration(fullSpanMs);
  cursorTime = new Date(Math.min(Math.max(NOW.getTime(), AXIS_START.getTime()), AXIS_START.getTime() + axisRightMs));

  rowsEl.innerHTML = "";
  builtRows = [];
  MODELS.forEach((model, idx) => {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.idx = idx;

    const label = document.createElement("div");
    label.className = "rowLabel";
    label.textContent = model.label;
    row.appendChild(label);

    const track = document.createElement("div");
    track.className = "rowTrack";
    row.appendChild(track);

    row.addEventListener("click", () => trySelectRow(idx));
    rowsEl.appendChild(row);
    builtRows.push({ model, row, track });
  });

  galleryEl.innerHTML = "";
  galleryCells = [];
  MODELS.forEach(model => {
    const cell = document.createElement("div");
    cell.className = "galleryCell";
    const titleEl = document.createElement("div");
    titleEl.className = "cellTitle";
    titleEl.textContent = model.label;
    const imgStack = document.createElement("div");
    imgStack.className = "imgStack";
    const imgEl = document.createElement("img");
    imgEl.className = "cellImg";
    imgEl.alt = "";
    const rainImgEl = document.createElement("img");
    rainImgEl.className = "cellRainImg";
    rainImgEl.alt = "";
    imgStack.appendChild(imgEl);
    imgStack.appendChild(rainImgEl);
    const bodyEl = document.createElement("div");
    bodyEl.className = "cellBody";
    cell.appendChild(titleEl);
    cell.appendChild(imgStack);
    cell.appendChild(bodyEl);
    galleryEl.appendChild(cell);
    galleryCells.push({ model, cell, titleEl, imgEl, rainImgEl, bodyEl });
  });

  buildTargetToggle();
  syncTargetLabels();
  layoutTicks();
  if (MODELS.length) selectRowForSingleView(0);
  // Browsers (Firefox in particular) restore radio/checkbox state across a
  // soft reload, so the DOM can already disagree with the defaults declared
  // above - adopt whatever is actually checked instead of assuming Cloud
  // cover, or the row lock and the visible selection would drift apart.
  // Ends in updateUI(), so no separate call here.
  rainOn = rainCheckbox.checked;
  const checkedQuantity = document.querySelector('input[name="quantityMode"]:checked');
  applyQuantityMode(checkedQuantity ? checkedQuantity.value : "cloudCover");
}

function timeToPx(t, trackWidthPx) {
  const frac = (t - AXIS_START) / axisRightMs;
  return Math.round(Math.min(1, Math.max(0, frac)) * trackWidthPx);
}

function pickAxisIntervalMs(spanMs) {
  const hourMs = 3600 * 1000;
  const candidatesH = [1, 2, 3, 6, 12, 24, 48, 96, 168, 336];
  for (const c of candidatesH) {
    if (spanMs / (c * hourMs) <= 8) return c * hourMs;
  }
  return candidatesH[candidatesH.length - 1] * hourMs;
}

function layoutTicks() {
  const trackWidthPx = axisTrack.getBoundingClientRect().width;
  builtRows.forEach(entry => {
    const { model, track } = entry;
    track.innerHTML = "";
    entry.ticks = [];
    model.runs.forEach(run => {
      if (run.runInit - AXIS_START > axisRightMs) return;
      const tick = document.createElement("div");
      tick.className = "tick" + (targetData(run).covers ? " covers" : " noCoverage");
      tick.style.left = timeToPx(run.runInit, trackWidthPx) + "px";
      tick.dataset.runMs = run.runInit.getTime();
      track.appendChild(tick);
      // Kept so the target toggle can repaint coverage without rebuilding
      // (and so it never has to re-derive which run a tick belongs to).
      entry.ticks.push({ run, el: tick });
    });
  });

  axisTrack.innerHTML = "";
  const intervalMs = pickAxisIntervalMs(axisRightMs);
  for (let ms = 0; ms <= axisRightMs; ms += intervalMs) {
    const t = new Date(AXIS_START.getTime() + ms);
    const el = document.createElement("div");
    el.className = "axisTick";
    el.style.left = timeToPx(t, trackWidthPx) + "px";
    el.textContent = t.toISOString().slice(5, 16).replace("T", " ");
    axisTrack.appendChild(el);
  }

  placeMarkers();
}

// Split out of layoutTicks() because switching target moves the target
// marker without touching a single tick.
function placeMarkers() {
  const trackRect = axisTrack.getBoundingClientRect();
  const wrapRect = stackWrap.getBoundingClientRect();
  const trackOffsetPx = trackRect.left - wrapRect.left;

  const placeMarker = (el, t) => {
    if (t >= AXIS_START && t - AXIS_START <= axisRightMs) {
      el.style.display = "block";
      el.style.left = Math.round(trackOffsetPx + timeToPx(t, trackRect.width)) + "px";
    } else {
      // Off the axis entirely - the normal case for the real-eclipse target,
      // which sits weeks past the last archived run. Hiding the line is
      // right; the per-panel tags below say so in place instead.
      el.style.display = "none";
    }
  };
  placeMarker(nowLine, NOW);
  placeMarker(eclipseLine, TARGET_VALID_TIME);
  // Flip the "target valid time" label to the left side of its line once
  // it's close enough to the track's right edge that the label would
  // otherwise overflow past the stack.
  const eclipsePx = timeToPx(TARGET_VALID_TIME, trackRect.width);
  eclipseLine.classList.toggle("flip", trackRect.width - eclipsePx < 90);
  // Purple is the eclipse specifically, not "whatever target is selected".
  eclipseLine.classList.toggle("isSim", currentTarget !== "eclipse");
}

function refreshTickCoverage() {
  builtRows.forEach(({ ticks }) => {
    (ticks || []).forEach(({ run, el }) => {
      const c = targetData(run).covers;
      el.classList.toggle("noCoverage", !c);
      el.classList.toggle("covers", c);
    });
  });
}

function nearestRun(model, targetTime) {
  // Same fix as Tool 1/2's own nearestStep - only consider runs still
  // inside the extent slider's current window, or a run the slider has
  // hidden can get picked as "nearest" with nothing on the visible axis
  // to show for it.
  const visible = model.runs.filter(r => r.runInit - AXIS_START <= axisRightMs);
  if (!visible.length) return null;
  return visible.reduce((best, r) =>
    Math.abs(r.runInit - targetTime) < Math.abs(best.runInit - targetTime) ? r : best
  );
}

function selectRowForSingleView(idx) {
  clickedRowIdx = idx;
  document.querySelectorAll(".row").forEach(r => {
    r.classList.toggle("clicked", parseInt(r.dataset.idx, 10) === idx);
  });
  updateUI();
}

// Guarded entry point for USER-driven row selection (row click, arrow keys).
// While Cloud prob has the selection locked to the prob-capable model, this
// refuses to move it - .row.disabled's pointer-events:none only stops direct
// clicks, it does nothing about keyboard navigation. applyQuantityMode's own
// forcing calls selectRowForSingleView directly, bypassing this on purpose.
function trySelectRow(idx) {
  if (idx === null || !builtRows[idx]) return false;
  if (quantityMode === "cloudProb" && builtRows[idx].model.id !== PROB_ONLY_MODEL) return false;
  selectRowForSingleView(idx);
  return true;
}

function applyQuantityMode(mode) {
  const wasForced = quantityMode === "cloudProb";
  quantityMode = mode;

  // builtRows is built in MODELS order, so the model's index IS its row index.
  // -1 when the manifest has no prob-capable model at all: grey nothing then,
  // and let every cell say why via PROB_HML_GAP instead of leaving the stack
  // fully disabled with nothing selectable.
  const probIdx = MODELS.findIndex(m => m.id === PROB_ONLY_MODEL);

  if (mode === "cloudProb" && probIdx !== -1) {
    if (!wasForced) rowBeforeProbForce = clickedRowIdx; // remember for when we leave
    builtRows.forEach(({ model, row }) => {
      row.classList.toggle("disabled", model.id !== PROB_ONLY_MODEL);
    });
    if (clickedRowIdx !== probIdx) {
      selectRowForSingleView(probIdx); // ends in updateUI()
      return;
    }
  } else {
    builtRows.forEach(({ row }) => row.classList.remove("disabled"));
    const restore = rowBeforeProbForce;
    rowBeforeProbForce = null;
    if (wasForced && restore !== null && restore !== clickedRowIdx && builtRows[restore]) {
      selectRowForSingleView(restore); // ends in updateUI()
      return;
    }
  }
  updateUI();
}

// Returns `sub` (the full sentence for the single-run map area) and `note`
// (the short version the small gallery cells show) - the prob/temp
// explanations are far too long to read inside a 160px cell.
function describeRunAtTarget(model, run) {
  const title = model.label + " · run " + fmtTime(run.runInit);
  const td = targetData(run); // never read covers/images/has_data off `run`

  // Answered before the coverage check on purpose: "this model has no such
  // quantity at all" is true regardless of whether this run reaches the
  // target, and saying "doesn't reach the target yet" would be misleading.
  if (!modelSupportsMode(model.id, quantityMode)) {
    const isTemp = quantityMode === "temp";
    return {
      covers: td.covers, hasImage: false, imageUrl: null, rainUrl: null, title,
      sub: isTemp ? "no temperature frames for this model yet" : PROB_HML_GAP,
      note: isTemp ? "no temp frames yet" : "no cloud prob. data",
    };
  }

  if (!td.covers) {
    const gapH = Math.round((TARGET_VALID_TIME - run.runInit) / 3600000);
    return {
      covers: false, hasImage: false, imageUrl: null, rainUrl: null, title,
      sub: gapH >= 0
        ? "run doesn't reach the target valid time yet (needs +" + gapH + "h)"
        // Can only happen if the manifest's target has drifted behind an
        // archived run - not a state today, but cheaper to word than to debug.
        : "target valid time is " + Math.abs(gapH) + "h before this run's init",
      note: "not yet covering",
    };
  }

  // Per-model field resolution over THIS target's images (see resolveField):
  // one cloud-cover field exists per model, composite where there are native
  // low/mid/high levels, plain total otherwise.
  const field = resolveField(td.images, td.hasData, quantityMode);
  const url = field ? td.images[field] : null;
  const rainUrl = (td.images || {}).rain || null;

  // The nearest published step rarely lands exactly on the target valid time
  // (misalignment_h); showing both makes it obvious when a frame is really
  // an hour or two off rather than exactly at T.
  let stamp = "valid " + fmtTime(TARGET_VALID_TIME);
  if (td.step !== null && td.step !== undefined) stamp += "  ·  step +" + td.step + "h";
  if (td.misalignmentH) stamp += " (" + td.misalignmentH + "h off)";

  return {
    covers: true,
    hasImage: !!url,
    imageUrl: url,
    rainUrl,
    title,
    sub: url ? stamp + "  ·  field: " + field : "no rendered frame for this run",
    note: url ? "" : "no rendered frame",
  };
}

// updateTargetEmpty() used to live here: a block between the run stack and the
// maps that appeared whenever nothing at the cursor had a frame, explaining
// why. It toggled display, so the map panels below jumped up and down as the
// cursor moved - and with the eclipse as the default target, where 2 runs of
// 245 have coverage, it was showing most of the time. The per-panel "not yet
// covering" tags already say the same thing in place, without moving anything.

function updateUI() {
  const trackRect = axisTrack.getBoundingClientRect();
  const wrapRect = stackWrap.getBoundingClientRect();
  const trackOffsetPx = trackRect.left - wrapRect.left;
  cursorLine.style.left = Math.round(trackOffsetPx + timeToPx(cursorTime, trackRect.width)) + "px";
  cursorReadout.textContent = "cursor " + fmtTime(cursorTime);

  // Rain overlays whatever base is selected, so it is gated on the MODEL
  // rather than on the quantity. In gallery view every model is on screen at
  // once, so "has rain" is asked of the set; in single view, of the one row.
  const rainModels = viewMode === "gallery"
    ? MODELS
    : (clickedRowIdx !== null && builtRows[clickedRowIdx] ? [builtRows[clickedRowIdx].model] : []);
  const modelHasRain = rainModels.some(m =>
    m.runs.some(r => Object.values(r.byTarget || {}).some(t => (t.images || {}).rain)));
  rainCheckbox.disabled = !modelHasRain;
  rainCheckbox.closest("label").classList.toggle("disabled", !modelHasRain);
  placeholderNote.textContent = modelHasRain ? "" : "no rain data for this model";
  mapAreaRainImg.style.display = "none";

  // Does anything on screen actually have a frame at this cursor position?
  // Collected here because the row loop already resolves every model's
  // nearest run, and both views need the same answer.
  let anyShown = false;
  builtRows.forEach(({ model, track }) => {
    const nearest = nearestRun(model, cursorTime);
    // null when the extent slider has hidden every run of this model.
    const nearestMs = nearest ? nearest.runInit.getTime() : null;
    if (nearest && targetData(nearest).covers) anyShown = true;
    track.querySelectorAll(".tick").forEach(tickEl => {
      tickEl.classList.toggle("near", parseFloat(tickEl.dataset.runMs) === nearestMs);
    });
  });
  if (viewMode === "gallery") {
    galleryCells.forEach(({ model, cell, imgEl, rainImgEl, bodyEl }) => {
      const run = nearestRun(model, cursorTime);
      // Dim the models that can't answer the current quantity at all (Cloud
      // prob. on anything but the one ensemble, Temp on everything) - the
      // cell then states it in words below rather than showing a broken or
      // empty image.
      cell.classList.toggle("unsupported", !modelSupportsMode(model.id, quantityMode));
      rainImgEl.style.display = "none";
      if (!run) {
        cell.classList.add("noCoverage");
        imgEl.style.display = "none";
        bodyEl.style.display = "flex";
        bodyEl.textContent = "no run in view";
        return;
      }
      const info = describeRunAtTarget(model, run);
      cell.classList.toggle("noCoverage", !info.covers);
      if (info.hasImage) {
        imgEl.src = info.imageUrl;
        imgEl.style.display = "block";
        bodyEl.style.display = "none";
        if (rainOn && info.rainUrl) {
          rainImgEl.src = info.rainUrl;
          rainImgEl.style.display = "block";
        }
      } else {
        imgEl.style.display = "none";
        bodyEl.style.display = "flex";
        bodyEl.textContent = info.note;
      }
    });
    return;
  }

  // single view
  if (clickedRowIdx === null || !builtRows[clickedRowIdx]) {
    setMapTag("click a row");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = "";
    mapAreaSub.textContent = "—";
    return;
  }
  const { model } = builtRows[clickedRowIdx];
  const run = nearestRun(model, cursorTime);
  if (!run) {
    setMapTag("no run in view");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = model.label;
    mapAreaSub.textContent = "the extent slider has hidden every archived run of this model";
    return;
  }
  const info = describeRunAtTarget(model, run);
  if (info.hasImage) {
    setMapTag("");
    mapAreaImg.src = info.imageUrl;
    mapAreaImg.style.display = "block";
    if (rainOn && info.rainUrl) {
      mapAreaRainImg.src = info.rainUrl;
      mapAreaRainImg.style.display = "block";
    }
  } else {
    setMapTag(info.covers ? "not available" : "not yet covering");
    mapAreaImg.style.display = "none";
  }
  mapAreaTitle.textContent = info.title;
  mapAreaSub.textContent = info.sub;
}

function timeFromClientX(clientX) {
  const rect = axisTrack.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  return new Date(AXIS_START.getTime() + frac * axisRightMs);
}

let dragging = false;
function startDrag(clientX) { dragging = true; cursorTime = timeFromClientX(clientX); updateUI(); }
function moveDrag(clientX) { if (dragging) { cursorTime = timeFromClientX(clientX); updateUI(); } }
function endDrag() { dragging = false; }

// The label column has no meaningful position on the time axis - it sits to
// the LEFT of axisTrack, so timeFromClientX() would clamp it to frac=0 (the
// axis start). Pressing on a label must therefore only ever select that
// model row (the row's own "click" listener does that, and still fires after
// this early return) and never yank the shared run-init cursor back to the
// start of the axis. Tool 3 has no separate row-drag mode - unlike tool2 the
// only drag axis here is time - so this just suppresses the drag entirely.
function isLabelTarget(target) {
  return !!(target && target.closest && target.closest(".rowLabel"));
}

stackWrap.addEventListener("mousedown", e => {
  if (isLabelTarget(e.target)) return;
  startDrag(e.clientX);
});
window.addEventListener("mousemove", e => moveDrag(e.clientX));
window.addEventListener("mouseup", endDrag);

// Touch counterparts of the three mouse handlers above, reusing the same
// startDrag/moveDrag/endDrag functions (and the same `dragging` flag) so
// touch and mouse drags are one code path. touchstart is passive (never
// preventDefault'd) so taps still synthesize a "click" afterward - that's
// what makes per-row tap-to-select work, same as a mouse click does.
// touchmove only preventDefault's while a drag is actually in progress, so
// scrolling/pinch-zoom elsewhere on the page (and taps on the quantity/view
// controls, which live outside #stackWrap) are never intercepted.
stackWrap.addEventListener("touchstart", e => {
  if (isLabelTarget(e.target)) return; // see isLabelTarget - tap still selects
  const t = e.touches[0];
  if (t) startDrag(t.clientX);
}, { passive: true });
window.addEventListener("touchmove", e => {
  if (!dragging) return;
  const t = e.touches[0];
  if (!t) return;
  e.preventDefault();
  moveDrag(t.clientX);
}, { passive: false });
window.addEventListener("touchend", endDrag);
window.addEventListener("touchcancel", endDrag);
quantityRadios.forEach(r => r.addEventListener("change", () => {
  if (r.checked) applyQuantityMode(r.value);
}));
rainCheckbox.addEventListener("change", () => {
  rainOn = rainCheckbox.checked;
  updateUI();
});

function setViewMode(mode) {
  viewMode = mode;
  viewGalleryBtn.classList.toggle("active", mode === "gallery");
  viewSingleBtn.classList.toggle("active", mode === "single");
  galleryEl.style.display = mode === "gallery" ? "grid" : "none";
  mapArea.style.display = mode === "single" ? "flex" : "none";
  updateUI();
}
viewGalleryBtn.addEventListener("click", () => setViewMode("gallery"));
viewSingleBtn.addEventListener("click", () => setViewMode("single"));

// Tool 3's two axes are not tool2's: rows are MODELS (one per model, all at
// the same fixed valid time) and the horizontal axis is RUN-INIT time, so
// up/down walks models and left/right walks the archived runs of whichever
// model row is currently clicked.
function advanceRow(direction) {
  if (!builtRows.length) return;
  const currentIndex = clickedRowIdx === null ? -1 : clickedRowIdx;
  const nextIndex = Math.min(builtRows.length - 1, Math.max(0, currentIndex + direction));
  trySelectRow(nextIndex); // no-op while Cloud prob. has the row locked
}

function advanceRun(direction) {
  const entry = clickedRowIdx === null ? builtRows[0] : builtRows[clickedRowIdx];
  if (!entry) return;
  // Same visibility filter as nearestRun - stepping must never land the
  // cursor on a run the extent slider has scrolled off the axis.
  const visible = entry.model.runs
    .filter(r => r.runInit - AXIS_START <= axisRightMs)
    .map(r => r.runInit.getTime())
    .sort((a, b) => a - b);
  if (!visible.length) return;
  const current = nearestRun(entry.model, cursorTime);
  const currentIndex = current === null ? -1 : visible.indexOf(current.runInit.getTime());
  const nextIndex = Math.min(visible.length - 1, Math.max(0, currentIndex + direction));
  cursorTime = new Date(visible[nextIndex]);
  updateUI();
}

const _ARROW_KEYS = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"];

window.addEventListener("keydown", e => {
  if (!_ARROW_KEYS.includes(e.key)) return;
  // Don't hijack arrow keys while the user is operating a focused control
  // (the quantity/target radios and the extent slider all have their own
  // native arrow-key behavior).
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  e.preventDefault();
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    advanceRun(e.key === "ArrowRight" ? 1 : -1);
  } else {
    // builtRows follows MODELS order top-to-bottom, so Down moves to the
    // next row visually below and Up to the one above.
    advanceRow(e.key === "ArrowDown" ? 1 : -1);
  }
});

extentInput.addEventListener("input", () => {
  axisRightMs = parseInt(extentInput.value, 10);
  extentReadout.textContent = fmtDuration(axisRightMs);
  cursorTime = new Date(Math.min(cursorTime.getTime(), AXIS_START.getTime() + axisRightMs));
  layoutTicks();
  updateUI();
});

let resizePending = false;
window.addEventListener("resize", () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => { layoutTicks(); updateUI(); resizePending = false; });
});

loadManifest()
  .then(init)
  .catch(err => {
    document.body.innerHTML = "<pre style='color:#8b3a2f'>failed to load tool3_manifest.json: " + err + "</pre>";
    console.error(err);
  });

// ---------------------------------------------------------------------------
// Periodic reload. The manifest is fetched once at load and never re-read, so
// a tab left open shows whatever was current when it opened - which, in the
// run-up to the eclipse, is exactly the wrong thing. Manifests rebuild every
// 60 s; this picks them up.
//
// A full reload rather than a live merge: the alternative means reconciling
// new runs against the selected model, cursor position and preloaded images
// mid-interaction, and getting that subtly wrong is worse than a reload you
// can see happen. Deferred while you are actually using the page - a reload
// that lands mid-drag would be infuriating - so the interval is a floor, not
// a promise.
// ---------------------------------------------------------------------------
const AUTO_RELOAD_MS = 600000;   // 10 min
const IDLE_BEFORE_RELOAD_MS = 60000;
let lastInteractionMs = Date.now();
["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(ev =>
  window.addEventListener(ev, () => { lastInteractionMs = Date.now(); }, { passive: true }));
setInterval(() => {
  if (Date.now() - lastInteractionMs < IDLE_BEFORE_RELOAD_MS) return;  // busy - try again next tick
  location.reload();
}, AUTO_RELOAD_MS);
</script>
</body>
</html>
