<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool 1 — latest run per model (real data, 10 gridded models)</title>
<style>
  html, body { height: 100%; }
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    background: #f6f4ef;
    color: #232320;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* the layout is sized to fit exactly - #mapArea below
      is the one flexible element that absorbs whatever room is left after
      the controls+slider, so nothing here should need to scroll. Kept as a
      safety net (not a hard requirement) - see #mapArea's own min-height. */
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 4px;
    font-size: 11.5px;
    border-bottom: 1px solid #d8d4c8;
    padding: 4px 6px;
    flex: none;
  }
  .controls label {
    color: #7a776c;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 9.5px;
  }
  .quantityGroup {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .quantityGroup .opt {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #232320;
    cursor: pointer;
  }
  .quantityGroup input[type=radio] { accent-color: #8b3a2f; }
  .rainOpt {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #232320;
    cursor: pointer;
    padding-left: 8px;
    border-left: 1px solid #d8d4c8;
  }
  .rainOpt input[type=checkbox] { accent-color: #2f5f8b; }
  .placeholderNote {
    font-size: 9.5px;
    color: #a8a498;
    font-style: italic;
  }
  .row.disabled {
    pointer-events: none;
    opacity: 0.35;
  }
  select {
    background: #fff;
    color: #232320;
    border: 1px solid #232320;
    border-radius: 0;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 11.5px;
  }
  #extentInput {
    width: 130px;
    accent-color: #8b3a2f;
    vertical-align: middle;
  }
  #extentReadout {
    font-variant-numeric: tabular-nums;
    color: #55534c;
    margin-left: 4px;
  }
  #cursorReadout {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    color: #8b3a2f;
    font-weight: 600;
  }
  #stackWrap {
    position: relative;
    border: 1px solid #232320;
    background: #fff;
    padding: 3px 14px 3px 0;
    user-select: none;
    flex: none; /* fixed content height - #mapArea below is the one flexible
      element, see body's own flex-column comment. */
    cursor: default; /* actual cursor is set by the hint-time/hint-row
      classes below, based on proximity to the time cursor vs. the selected
      row's own band - see script's hitZoneAt(). */
    touch-action: none; /* this element owns the drag-to-scrub gesture -
      stop the browser's own pan/zoom gestures inside it so touchmove
      dragging (see script) isn't fought over with native scrolling. Scoped
      to this element only, not body - page scroll elsewhere is untouched. */
  }
  #stackWrap.hint-time { cursor: ew-resize; }
  #stackWrap.hint-row { cursor: ns-resize; }
  .row {
    display: flex;
    align-items: center;
    height: 11px;
  }
  .row:hover { background: #f6f4ef; }
  .row.selected { background: #f0e8d2; }
  .rowLabel {
    width: 108px;
    flex: none;
    font-size: 9px;
    color: #55534c;
    padding-left: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.selected .rowLabel { color: #232320; font-weight: 700; }
  .preloadBtn {
    width: 22px;
    flex: none;
    font-size: 8px;
    text-align: center;
    color: #a8a498;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    position: relative;
  }
  .preloadBtn::before {
    /* Invisible tap-target bump: the row (and so this button) is only 11px
       tall, too small to comfortably hit on a phone, but growing the row
       itself would reflow the whole dense stack. This pseudo-element is
       absolutely positioned (out of flow) so it doesn't change layout at
       all - it only widens the *hit area* for touch/click. */
    content: "";
    position: absolute;
    top: -3px;
    bottom: -3px;
    left: -4px;
    right: -4px;
  }
  .preloadBtn:hover { color: #232320; }
  .preloadBtn.loading { color: #8b3a2f; }
  .preloadBtn.done { color: #2f6f3f; }
  .rowTrack {
    position: relative;
    flex: 1;
    height: 100%;
  }
  .tick {
    position: absolute;
    top: 2px;
    width: 2px;
    height: 7px;
    background: #a19e92;
  }
  .row.selected .tick { background: #8a5a20; }
  .tick.near {
    width: 3px;
    height: 11px;
    top: 0;
    background: #8b3a2f;
  }
  .tick.isInit {
    background: #55534c;
    width: 2px;
    height: 11px;
    top: 0;
  }
  .row.selected .tick.isInit { background: #232320; }
  #nowLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #2f6f3f;
    pointer-events: none;
    z-index: 4;
    opacity: 0.6;
  }
  #cursorLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #8b3a2f;
    pointer-events: none;
    z-index: 5;
  }
  #cursorHandle {
    /* No cursor: ew-resize here - it would never actually apply. This
      element inherits pointer-events:none from its parent #cursorLine (it's
      purely decorative, see the script's own note on why), so the browser
      never resolves hover/cursor-shape against it - #stackWrap/.row above
      are what the mouse actually sees. */
    position: absolute;
    top: -7px;
    width: 0;
    height: 0;
    margin-left: -5px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 7px solid #8b3a2f;
    z-index: 6;
  }
  #axisRow {
    display: flex;
    align-items: center;
    height: 14px;
    margin-top: 3px;
    border-top: 1px solid #232320;
  }
  #axisRow .rowLabel, #axisRow .preloadBtn { visibility: hidden; }
  .axisTick {
    position: absolute;
    top: 3px;
    font-size: 9px;
    color: #7a776c;
    transform: translateX(-50%);
  }
  #mapArea {
    margin-top: 2px;
    border: 1px solid #232320;
    background: #fff;
    flex: 1;    /* absorbs whatever vertical room is left below the fixed-size
      controls/slider above - the map image (below) then flexes to fill
      whatever that turns out to be, instead of dictating the page height by
      its own width-scaled aspect ratio. */
    min-height: 80px; /* just enough for the placeholder/error text to stay
      legible on a very cramped viewport - not a target size. */
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    color: #7a776c;
    font-size: 12px;
    padding: 6px;
    box-sizing: border-box;
  }
  #mapAreaImg {
    max-width: 100%;
    flex: 1 1 0;
    min-height: 0; /* required for a flex item to shrink below its own
      intrinsic (width-scaled) height inside a column flex container */
    width: auto;
    object-fit: contain; /* scale to fit the flexed box on both axes, not
      just width, preserving aspect ratio - the actual fix for the map not
      fitting the viewport alongside the slider. */
    display: none;
  }
  #mapArea .big { font-size: 14px; color: #232320; font-weight: 700; }
  #mapArea .placeholder-tag {
    font-size: 9.5px;
    color: #a8a498;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
</style>
</head>
<body>

<div class="controls">
  <div class="quantityGroup" id="quantityGroup">
    <label style="margin-right:0">Quantity</label>
    <label class="opt"><input type="radio" name="quantityMode" value="temp"> Temp</label>
    <label class="opt"><input type="radio" name="quantityMode" value="cloudCover" checked> Cloud cover</label>
    <label class="opt"><input type="radio" name="quantityMode" value="cloudProb"> Cloud prob.</label>
  </div>
  <label class="rainOpt"><input type="checkbox" id="rainCheckbox"> Rain</label>
  <span class="placeholderNote" id="placeholderNote"></span>
  <div>
    <label for="extentInput">Extent</label>
    <input type="range" id="extentInput" min="0" max="1" step="3600000" value="1">
    <span id="extentReadout">384h</span>
  </div>
  <div id="cursorReadout">—</div>
</div>

<div id="stackWrap">
  <div id="rows"></div>
  <div id="axisRow"><div class="rowLabel"></div><div class="preloadBtn"></div><div class="rowTrack" id="axisTrack"></div></div>
  <div id="cursorLine"><div id="cursorHandle"></div></div>
  <div id="nowLine"></div>
</div>

<div id="mapArea">
  <div class="placeholder-tag" id="mapAreaTag">loading manifest…</div>
  <img id="mapAreaImg" alt="">
  <div class="big" id="mapAreaTitle"></div>
  <div id="mapAreaSub">—</div>
</div>

<script>
let MODELS = [];        // [{id, label, runInit (Date), steps: [h,...], imagesByStep: {h: {...fields}}}]
let AXIS_START = new Date(), AXIS_END = new Date(); // full span across all loaded models' runs/reach
let axisRightMs = 0;    // current right edge, ms from AXIS_START - narrowed by the extent slider
let selectedModel = null;
let cursorTime = new Date();

// Quantity is a 3-way radio (temp/cloudCover/cloudProb) + an independent
// rain overlay checkbox - see tool1_renderer.py's hml_composite/prob_*
// fields, which is what backs cloudCover/cloudProb here. Temp and the rain
// overlay are both placeholders (no real data path yet).
let quantityMode = "cloudCover";
let rainOn = false;
// Cloud prob only ever has data for aifs_ens (the only ensemble with a
// native low/mid/high split) - selecting it force-switches the model and
// greys out every other row; this remembers what was selected before, so
// switching back to Cloud cover/Temp restores it instead of leaving you
// stuck on aifs_ens.
let modelBeforeProbForce = null;
const PROB_ONLY_MODEL = "aifs_ens";

const rowsEl = document.getElementById("rows");
const axisTrack = document.getElementById("axisTrack");
const stackWrap = document.getElementById("stackWrap");
const cursorLine = document.getElementById("cursorLine");
const cursorReadout = document.getElementById("cursorReadout");
const nowLine = document.getElementById("nowLine");
const mapAreaTag = document.getElementById("mapAreaTag");
// A real, successfully-rendered frame needs no banner - the image speaks
// for itself. Collapsed via display:none (not just an empty string) so it
// doesn't leave behind an empty line's worth of vertical space/gap.
function setMapTag(text) {
  mapAreaTag.textContent = text;
  mapAreaTag.style.display = text ? "" : "none";
}
const mapAreaImg = document.getElementById("mapAreaImg");
const mapAreaTitle = document.getElementById("mapAreaTitle");
const mapAreaSub = document.getElementById("mapAreaSub");
const quantityRadios = document.querySelectorAll('input[name="quantityMode"]');
const rainCheckbox = document.getElementById("rainCheckbox");
const placeholderNote = document.getElementById("placeholderNote");
const extentInput = document.getElementById("extentInput");
const extentReadout = document.getElementById("extentReadout");

let builtRows = []; // [{model, track}] - populated once per manifest load, reused by every relayout

function stepValidTime(model, h) {
  return new Date(model.runInit.getTime() + h * 3600 * 1000);
}

function fmtTime(d) {
  return d.toISOString().slice(0, 16).replace("T", " ") + "Z";
}

function fmtDuration(ms) {
  const h = ms / 3600000;
  return h < 48 ? h.toFixed(0) + "h" : (h / 24).toFixed(1) + "d";
}

async function loadManifest() {
  const resp = await fetch("manifest.json");
  if (!resp.ok) throw new Error("manifest.json fetch failed: HTTP " + resp.status);
  const manifest = await resp.json();

  MODELS = manifest.models.map(m => ({
    id: m.id,
    label: m.label,
    runInit: new Date(m.run_init),
    steps: m.steps.map(s => s.h),
    imagesByStep: Object.fromEntries(m.steps.map(s => [s.h, s.images])),
    // has_data is a per-field manifest addition (patch_manifest_has_data.py) -
    // older manifests won't have it; default to "assume real" rather than
    // hide everything if this widget ever runs against a stale manifest.
    hasDataByStep: Object.fromEntries(m.steps.map(s => [s.h, s.has_data || null])),
  }));

  AXIS_START = new Date(Math.min(...MODELS.map(m => m.runInit.getTime())));
  const reaches = MODELS.map(m => stepValidTime(m, m.steps.length ? Math.max(...m.steps) : 0).getTime());
  AXIS_END = new Date(Math.max(...reaches, AXIS_START.getTime()));
  axisRightMs = Math.max(AXIS_END - AXIS_START, 3600 * 1000);

  extentInput.min = 0;
  extentInput.max = axisRightMs;
  extentInput.step = 3600 * 1000;
  extentInput.value = axisRightMs;
  extentReadout.textContent = fmtDuration(axisRightMs);

  // Default cursor to "now" (clamped into the axis span) rather than the axis
  // start - the whole point of a shared absolute-time cursor is comparing
  // models around the current moment, not around whichever model happens to
  // have archived the oldest run.
  cursorTime = new Date();
  if (cursorTime < AXIS_START) cursorTime = new Date(AXIS_START);
  if (cursorTime - AXIS_START > axisRightMs) cursorTime = new Date(AXIS_START.getTime() + axisRightMs);
}

function pickAxisIntervalMs(spanMs) {
  const hourMs = 3600 * 1000;
  const candidatesH = [1, 2, 3, 6, 12, 24, 48, 96, 168, 336];
  for (const c of candidatesH) {
    if (spanMs / (c * hourMs) <= 10) return c * hourMs;
  }
  return candidatesH[candidatesH.length - 1] * hourMs;
}

function timeToPx(t, trackWidthPx) {
  const frac = (t - AXIS_START) / axisRightMs;
  return Math.round(Math.min(1, Math.max(0, frac)) * trackWidthPx);
}

// Only ever 4 fields actually shown now (the rest - total/low/mid/high -
// are still rendered/cached server-side since hml_composite is built from
// them, but never displayed directly): the two "primary" composites and
// their two fallbacks, resolved per (model, mode) in resolveField() below.
const IMAGE_FIELDS = ["hml_composite", "total", "prob_hml_composite"];

// resolveField() picks which field to actually display for the current
// quantityMode - Comb Color (the R=High/G=Mid/B=Low composite) by default,
// falling back to plain Total if this model doesn't have native low/mid/high
// to build a composite from (ecmwf_hres/ecmwf_ens - they only ever have
// native total). Cloud prob only ever has real data for aifs_ens (see
// PROB_ONLY_MODEL/applyQuantityMode) - no Total fallback for it, there's
// nothing to fall back to (prob_total is deliberately not rendered).
function resolveField(model, step, mode) {
  const hasData = (model.hasDataByStep[step] || {});
  if (mode === "cloudCover") {
    if (hasData.hml_composite) return "hml_composite";
    if (hasData.total) return "total";
    return null;
  }
  if (mode === "cloudProb") {
    return hasData.prob_hml_composite ? "prob_hml_composite" : null;
  }
  return null; // temp - placeholder, no field to resolve yet
}

const preloadedModels = new Set();

function preloadModel(model, btnEl) {
  if (preloadedModels.has(model.id)) return;
  if (btnEl.classList.contains("loading")) return; // already in flight - a second
    // click here used to start an overlapping preload pass with its own
    // independent `loaded` counter, racing the first and making the shown
    // percentage jump around between the two.
  const urls = [];
  model.steps.forEach(h => {
    const images = model.imagesByStep[h] || {};
    IMAGE_FIELDS.forEach(f => { if (images[f]) urls.push(images[f]); });
  });
  if (!urls.length) return;

  btnEl.classList.add("loading");
  btnEl.classList.remove("done");
  let loaded = 0;
  btnEl.textContent = "0%";
  urls.forEach(url => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loaded++;
      btnEl.textContent = Math.round((loaded / urls.length) * 100) + "%";
      if (loaded === urls.length) {
        preloadedModels.add(model.id);
        btnEl.classList.remove("loading");
        btnEl.classList.add("done");
        btnEl.textContent = "✓";
      }
    };
    img.src = url;
  });
}

function buildRows() {
  rowsEl.innerHTML = "";
  builtRows = [];
  MODELS.forEach(model => {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.modelId = model.id;

    const label = document.createElement("div");
    label.className = "rowLabel";
    label.textContent = model.label;
    row.appendChild(label);

    const preloadBtn = document.createElement("div");
    preloadBtn.className = "preloadBtn";
    preloadBtn.textContent = "⤓";
    preloadBtn.title = "Preload all frames for " + model.label + " (smoother scrubbing)";
    preloadBtn.addEventListener("click", e => {
      e.stopPropagation(); // don't also trigger the row's own select-on-click
      preloadModel(model, preloadBtn);
    });
    row.appendChild(preloadBtn);

    const track = document.createElement("div");
    track.className = "rowTrack";
    row.appendChild(track);

    rowsEl.appendChild(row);
    builtRows.push({ model, row, track });
  });
}

function layoutTicks() {
  const trackWidthPx = axisTrack.getBoundingClientRect().width;
  builtRows.forEach(({ model, track }) => {
    track.innerHTML = "";
    model.steps.forEach(h => {
      const vt = stepValidTime(model, h);
      if (vt - AXIS_START > axisRightMs) return;
      const tick = document.createElement("div");
      tick.className = "tick" + (h === 0 ? " isInit" : "");
      tick.style.left = timeToPx(vt, trackWidthPx) + "px";
      tick.dataset.hour = h;
      track.appendChild(tick);
    });
  });

  axisTrack.innerHTML = "";
  const intervalMs = pickAxisIntervalMs(axisRightMs);
  for (let ms = 0; ms <= axisRightMs; ms += intervalMs) {
    const t = new Date(AXIS_START.getTime() + ms);
    const el = document.createElement("div");
    el.className = "axisTick";
    el.style.left = timeToPx(t, trackWidthPx) + "px";
    el.textContent = t.toISOString().slice(5, 16).replace("T", " ");
    axisTrack.appendChild(el);
  }

  const trackRect = axisTrack.getBoundingClientRect();
  const wrapRect = stackWrap.getBoundingClientRect();
  const trackOffsetPx = trackRect.left - wrapRect.left;
  const now = new Date();
  if (now >= AXIS_START && now - AXIS_START <= axisRightMs) {
    nowLine.style.display = "block";
    nowLine.style.left = Math.round(trackOffsetPx + timeToPx(now, trackRect.width)) + "px";
  } else {
    nowLine.style.display = "none";
  }
}

function nearestStep(model, targetTime) {
  // Only consider steps still inside the extent slider's current window
  // (same fix as Tool 2's own nearestStep - see that file for the full
  // rationale): without this, a step the slider has hidden past a cadence
  // gap can be picked as "nearest" even though nothing on the visible,
  // narrowed axis corresponds to it.
  const visible = model.steps.filter(h => stepValidTime(model, h) - AXIS_START <= axisRightMs);
  if (!visible.length) return null;
  return visible.reduce((best, h) =>
    Math.abs(stepValidTime(model, h) - targetTime) < Math.abs(stepValidTime(model, best) - targetTime) ? h : best
  );
}

function selectModel(modelId) {
  selectedModel = modelId;
  document.querySelectorAll(".row").forEach(r => {
    r.classList.toggle("selected", r.dataset.modelId === modelId);
  });
  updateCursorUI();
}

function applyQuantityMode(mode) {
  const wasForced = quantityMode === "cloudProb";
  quantityMode = mode;

  if (mode === "cloudProb") {
    if (!wasForced) modelBeforeProbForce = selectedModel; // remember for when we leave
    document.querySelectorAll(".row").forEach(r => {
      r.classList.toggle("disabled", r.dataset.modelId !== PROB_ONLY_MODEL);
    });
    if (selectedModel !== PROB_ONLY_MODEL && MODELS.some(m => m.id === PROB_ONLY_MODEL)) {
      selectModel(PROB_ONLY_MODEL);
    }
  } else {
    document.querySelectorAll(".row").forEach(r => r.classList.remove("disabled"));
    if (wasForced && modelBeforeProbForce && modelBeforeProbForce !== PROB_ONLY_MODEL) {
      selectModel(modelBeforeProbForce);
    }
    modelBeforeProbForce = null;
  }
  updateCursorUI();
}

function updateCursorUI() {
  const trackRect = axisTrack.getBoundingClientRect();
  const wrapRect = stackWrap.getBoundingClientRect();
  const trackOffsetPx = trackRect.left - wrapRect.left;
  const leftPx = trackOffsetPx + timeToPx(cursorTime, trackRect.width);
  cursorLine.style.left = Math.round(leftPx) + "px";
  cursorReadout.textContent = "cursor " + fmtTime(cursorTime);

  document.querySelectorAll(".row").forEach(rowEl => {
    const model = MODELS.find(m => m.id === rowEl.dataset.modelId);
    const nearest = nearestStep(model, cursorTime);
    rowEl.querySelectorAll(".tick").forEach(tickEl => {
      tickEl.classList.toggle("near", parseFloat(tickEl.dataset.hour) === nearest);
    });
  });

  if (!selectedModel) {
    setMapTag("select a model");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = "";
    mapAreaSub.textContent = "—";
    return;
  }

  const model = MODELS.find(m => m.id === selectedModel);
  const step = nearestStep(model, cursorTime);

  placeholderNote.textContent = rainOn ? "rain overlay: not yet implemented" : "";

  if (quantityMode === "temp") {
    setMapTag("not available");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = model.label;
    mapAreaSub.textContent = "temperature: not yet implemented";
    return;
  }

  const field = step === null ? null : resolveField(model, step, quantityMode);
  const images = step === null ? null : model.imagesByStep[step];
  const url = field && images ? images[field] : null;

  if (url) {
    setMapTag("");
    mapAreaImg.src = url;
    mapAreaImg.style.display = "block";
    mapAreaTitle.textContent = model.label + " · run " + fmtTime(model.runInit);
    mapAreaSub.textContent = "step +" + step + "h  ·  valid " + fmtTime(stepValidTime(model, step));
  } else {
    setMapTag("not available");
    mapAreaImg.style.display = "none";
    mapAreaTitle.textContent = model.label;
    mapAreaSub.textContent = step === null
      ? "no step available"
      : (quantityMode === "cloudProb"
          ? "needs an ensemble with native low/mid/high - only AIFS ENS qualifies"
          : "no rendered frame for this step");
  }
}

function timeFromClientX(clientX) {
  const rect = axisTrack.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  return new Date(AXIS_START.getTime() + frac * axisRightMs);
}

// Two independent drag handles, each only grabbable near its OWN current
// position: the vertical (time) cursor horizontally, the horizontal (row)
// cursor vertically - the latter has no drawn line, the row highlight IS
// its visual (same mechanic as Tool 2's own run-picker). Clicking away from
// both still jumps both immediately; dragging only "sticks" to a handle
// grabbed within its hit zone.
const CURSOR_HIT_PX = 8;   // horizontal tolerance around the vertical cursor line
const ROW_HIT_PAD_PX = 6;  // vertical tolerance around the selected row's own band
const CURSOR_HIT_PX_TOUCH = 20;  // same, widened for a finger instead of a mouse pointer
const ROW_HIT_PAD_PX_TOUCH = 16;

function isNearCursorLine(clientX) {
  const rect = cursorLine.getBoundingClientRect();
  const tol = isTouch ? CURSOR_HIT_PX_TOUCH : CURSOR_HIT_PX;
  return Math.abs(clientX - (rect.left + rect.width / 2)) <= tol;
}

function isNearSelectedRow(clientY) {
  const entry = builtRows.find(r => r.model.id === selectedModel);
  if (!entry) return false;
  const r = entry.row.getBoundingClientRect();
  const pad = isTouch ? ROW_HIT_PAD_PX_TOUCH : ROW_HIT_PAD_PX;
  return clientY >= r.top - pad && clientY <= r.bottom + pad;
}

function modelIdAtClientY(clientY) {
  if (!builtRows.length) return null;
  for (const entry of builtRows) {
    const r = entry.row.getBoundingClientRect();
    if (clientY >= r.top && clientY <= r.bottom) return entry.model.id;
  }
  if (clientY < builtRows[0].row.getBoundingClientRect().top) return builtRows[0].model.id;
  if (clientY > builtRows[builtRows.length - 1].row.getBoundingClientRect().bottom) {
    return builtRows[builtRows.length - 1].model.id;
  }
  return null;
}

// Precedence: the vertical (time) cursor wins where both hit zones overlap.
function hitZoneAt(clientX, clientY) {
  if (isNearCursorLine(clientX)) return "time";
  if (isNearSelectedRow(clientY)) return "row";
  return null;
}

function applyHoverHint(clientX, clientY) {
  const zone = hitZoneAt(clientX, clientY);
  stackWrap.classList.toggle("hint-time", zone === "time");
  stackWrap.classList.toggle("hint-row", zone === "row");
}

let dragMode = null; // "time" | "row" | null (a plain click, no continued drag-follow)
let isTouch = false; // true while the current interaction is touch-driven - widens hit tolerances

// While Cloud Prob mode has forced/locked the model to PROB_ONLY_MODEL (see
// applyQuantityMode), the row-drag mechanic below must not be able to switch
// away from it just because the pointer passes over another (greyed-out)
// row's geometry - .row.disabled's pointer-events:none only stops direct
// hit-testing on that element, it doesn't stop modelIdAtClientY's own
// getBoundingClientRect-based lookup. Returns whether the switch happened.
function trySelectModel(modelId) {
  if (modelId === null) return false;
  if (quantityMode === "cloudProb" && modelId !== PROB_ONLY_MODEL) return false;
  selectModel(modelId);
  return true;
}

function startDrag(clientX, clientY) {
  dragMode = hitZoneAt(clientX, clientY);
  if (dragMode === "time") {
    cursorTime = timeFromClientX(clientX);
    updateCursorUI();
  } else if (dragMode === "row") {
    trySelectModel(modelIdAtClientY(clientY));
  } else {
    // Away from both handles: plain click still jumps both, same as before.
    cursorTime = timeFromClientX(clientX);
    if (!trySelectModel(modelIdAtClientY(clientY))) updateCursorUI();
  }
  applyHoverHint(clientX, clientY);
}

function moveDrag(clientX, clientY) {
  if (dragMode === "time") {
    cursorTime = timeFromClientX(clientX);
    updateCursorUI();
  } else if (dragMode === "row") {
    const modelId = modelIdAtClientY(clientY);
    if (modelId !== selectedModel) trySelectModel(modelId);
  }
  applyHoverHint(clientX, clientY);
}

function endDrag() { dragMode = null; isTouch = false; }

// The label column has no meaningful position on the time axis - it sits to
// the LEFT of axisTrack, so timeFromClientX() would clamp it to frac=0 (the
// axis start). Clicking it must therefore only ever switch models, never
// touch cursorTime - unlike the general "click away from both handles jumps
// both" behavior everywhere else in the row (see startDrag's else branch).
function handleLabelPointerDown(target, clientX, clientY) {
  const label = target.closest(".rowLabel");
  if (!label) return false;
  const row = label.closest(".row");
  if (row) trySelectModel(row.dataset.modelId);
  // Starting on the label still begins a row-drag - moveDrag's "row" branch
  // only ever looks at clientY, so continuing to drag up/down from here
  // switches models same as starting from the track, it just never touches
  // cursorTime the way starting from elsewhere in a non-selected row would.
  dragMode = "row";
  applyHoverHint(clientX, clientY);
  return true;
}

stackWrap.addEventListener("mousedown", e => {
  if (e.target.closest(".preloadBtn")) return;
  isTouch = false;
  if (handleLabelPointerDown(e.target, e.clientX, e.clientY)) return;
  startDrag(e.clientX, e.clientY);
});
window.addEventListener("mousemove", e => moveDrag(e.clientX, e.clientY));
window.addEventListener("mouseup", endDrag);
quantityRadios.forEach(r => r.addEventListener("change", () => {
  if (r.checked) applyQuantityMode(r.value);
}));
rainCheckbox.addEventListener("change", () => {
  rainOn = rainCheckbox.checked;
  updateCursorUI();
});

// Touch: same startDrag/moveDrag/endDrag as mouse, same attachment points
// (touchstart on stackWrap only, touchmove/touchend on window so a drag that
// leaves stackWrap's bounds is still tracked) - just fed touch coordinates.
stackWrap.addEventListener("touchstart", e => {
  if (e.target.closest(".preloadBtn")) return;
  const t = e.touches[0];
  if (!t) return;
  isTouch = true;
  if (handleLabelPointerDown(e.target, t.clientX, t.clientY)) return;
  startDrag(t.clientX, t.clientY);
  // No preventDefault here: an off-handle tap must still fall through to the
  // "click away still jumps both" behavior, and must not block page scroll.
}, { passive: true });
window.addEventListener("touchmove", e => {
  if (!dragMode) return; // let untouched scrolling/other controls behave normally
  const t = e.touches[0];
  if (!t) return;
  e.preventDefault(); // only swallow the scroll/zoom gesture once a real handle drag is underway
  moveDrag(t.clientX, t.clientY);
}, { passive: false });
window.addEventListener("touchend", endDrag);
window.addEventListener("touchcancel", endDrag); // e.g. OS interrupts the touch mid-drag

function advanceStep(direction) {
  if (!selectedModel) return;
  const model = MODELS.find(m => m.id === selectedModel);
  const visible = model.steps
    .filter(h => stepValidTime(model, h) - AXIS_START <= axisRightMs)
    .sort((a, b) => a - b);
  if (!visible.length) return;
  const current = nearestStep(model, cursorTime);
  const currentIndex = current === null ? -1 : visible.indexOf(current);
  const nextIndex = Math.min(visible.length - 1, Math.max(0, currentIndex + direction));
  cursorTime = stepValidTime(model, visible[nextIndex]);
  updateCursorUI();
}

function advanceModel(direction) {
  if (!MODELS.length) return;
  const currentIndex = MODELS.findIndex(m => m.id === selectedModel);
  const nextIndex = currentIndex === -1 ? 0 : Math.min(MODELS.length - 1, Math.max(0, currentIndex + direction));
  trySelectModel(MODELS[nextIndex].id); // no-op while Cloud Prob mode has the model locked
}

const _ARROW_KEYS = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"];

window.addEventListener("keydown", e => {
  if (!_ARROW_KEYS.includes(e.key)) return;
  // Don't hijack arrow keys while the user is operating a focused control
  // (the extent range slider has its own native arrow-key behavior).
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  e.preventDefault();
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    advanceStep(e.key === "ArrowRight" ? 1 : -1);
  } else {
    advanceModel(e.key === "ArrowDown" ? 1 : -1);
  }
});

extentInput.addEventListener("input", () => {
  axisRightMs = parseInt(extentInput.value, 10);
  extentReadout.textContent = fmtDuration(axisRightMs);
  cursorTime = new Date(Math.min(cursorTime.getTime(), AXIS_START.getTime() + axisRightMs));
  layoutTicks();
  updateCursorUI();
});

let resizePending = false;
window.addEventListener("resize", () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => {
    layoutTicks();
    updateCursorUI();
    resizePending = false;
  });
});

loadManifest()
  .then(() => {
    buildRows();
    layoutTicks();
    if (MODELS.length) selectModel(MODELS[0].id);
    updateCursorUI();
  })
  .catch(err => {
    setMapTag("error");
    mapAreaTitle.textContent = "failed to load manifest.json";
    mapAreaSub.textContent = String(err);
    console.error(err);
  });
</script>
</body>
</html>
