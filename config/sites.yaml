# config/sites.yaml — WNW-sightline geometry for point extraction.
#
# The PLACE LIST no longer lives here. It is config/placenames.json: the
# frozen, hand-curated 29 (T41, 2026-07-24 — GeoNames ES filtered to
# admin_rank<=3 and population>=34000, metro clusters collapsed to their
# largest member, Madrid injected). src/config.py's load_sites() reads the
# places from there and the wnw_strip geometry below from here, so the list
# has exactly one home and cannot drift between two files.
#
# Replaced the original 7-site placeholder shortlist 2026-07-27 ("Not union,
# replace"). Luarca, Leon, Logrono and Castellon were in that shortlist but
# not in the curated 29; they stop accumulating from that date and their
# existing points.parquet rows stay as historical data.
#
# wnw_strip: at T the sun is ~11 deg elevation, ~285 deg azimuth (WNW).
# Cloud along this sightline matters as much as overhead cloud, so every
# place also samples a short strip toward the sun rather than just its own
# pixel. NOTE: this is a ground-projected strip that treats every cloud
# level alike at each sample point — a deliberate simplification. A proper
# 3D line-of-sight calculation (where low and high cloud intersect the
# sightline at different ground distances) is an open design thread; see
# TASKS.md T44's pressure-level availability survey, which exists for it.

wnw_strip:
  bearing_deg: 285
  length_km: 100
  sample_every_km: 25
